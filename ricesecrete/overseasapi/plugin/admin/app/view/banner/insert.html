<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>新增页面</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css?v=<?=get_version() ?>"/>
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css?v=<?=get_version() ?>"/>
</head>
<body>

<form class="layui-form" action="">

    <div class="mainBox">
        <div class="main-container mr-5">
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="标题">标题</label>
                <div class="layui-input-block">
                    <input type="text" name="title" value="" required lay-verify="required" class="layui-input" data-lang="请输入标题" placeholder="请输入标题">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="所属位置">所属位置</label>
                <div class="layui-input-block">
                    <select name="position" lay-verify="required">
                        <option value="1">首页</option>
                        <option value="2">视频页</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="广告类型">广告类型</label>
                <div class="layui-input-block">
                    <select name="type" lay-verify="required">
                        <option value="1">图片</option>
                        <option value="2">视频</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="跳转地址">跳转地址</label>
                <div class="layui-input-block">
                    <input type="text" name="target_url" value=""   class="layui-input" data-lang="请输入跳转地址或者视频地址" placeholder="请输入跳转地址或者视频地址">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="展示图片">展示图片</label>
                <div class="layui-input-block">
                    <input type="text" style="display:none" name="thumb_img" value=""/>
                    <button type="button" class="pear-btn pear-btn-primary pear-btn-sm" id="flag">
                        <i class="layui-icon layui-icon-upload"></i><span data-lang="上传图片">上传图片</span>
                    </button>
                    <button type="button" class="pear-btn pear-btn-danger pear-btn-sm" id="deleteFlag"
                            style="display:none;margin-left: 10px;">
                        <i class="layui-icon layui-icon-delete"></i><span data-lang="删除图片">删除图片</span>
                    </button>
                    <div id="flagPreview" style="margin-top: 10px;display:none;">
                        <img src="" style="max-width: 200px;max-height: 200px;border: 1px solid #eee;padding: 5px;">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="状态">状态</label>
                <div class="layui-input-block">
                    <input type="checkbox" id="status" lay-filter="status" lay-skin="switch" data-lang="启用|禁用" lay-text="启用|禁用"/>
                    <input type="text" style="display:none" name="status" value="0" data-lang="启用|禁用" lay-text="启用|禁用"/>
                </div>
            </div>

        </div>
    </div>

    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="pear-btn pear-btn-primary pear-btn-md" lay-submit=""
                    lay-filter="save">
                <span data-lang="提交">提交</span>
            </button>
            <button type="reset" class="pear-btn pear-btn-md">
                <span data-lang="重置">重置</span>
            </button>
        </div>
    </div>

</form>

<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script src="/app/admin/admin/js/permission.js"></script>
<script>

    // 相关接口
    const INSERT_API = "/app/admin/banner/insert";

    // 字段 文件 url
    layui.use(["upload", "layer", "popup", "util"], function () {
        let $ = layui.$;
        let input = $("#flag").prev();
        let deleteBtn = $("#deleteFlag");
        let previewContainer = $("#flagPreview");
        let previewImg = previewContainer.find('img');

        // 初始化显示
        function initDisplay() {
            let imgUrl = input.val();
            if (imgUrl) {
                previewImg.attr('src', imgUrl);
                previewContainer.show();
                deleteBtn.show();
            } else {
                previewContainer.hide();
                deleteBtn.hide();
            }
        }

        // 初始调用
        initDisplay();

        // 上传功能
        layui.upload.render({
            elem: "#flag",
            url: "/app/admin/upload/file",
            data: {
                folder: "/hkxa/banner/"
            },
            accept: "file",
            field: "__file__",
            done: function (res) {
                if (res.code) return layui.popup.failure(getText(res.msg));
                $('input[name="thumb_img"]').val(res.data.url);
                initDisplay(); // 更新显示
                parent.refreshTable();
            }
        });
        // 删除功能
        deleteBtn.on('click', function () {
            layui.layer.confirm(getText('确定要删除这张图片吗？'), function (index) {
                input.val('');
                initDisplay(); // 更新显示
                layui.layer.close(index);
            });
        });
    });
    // 字段 禁用 status
    layui.use(["form"], function () {
        layui.$("#status").attr("checked", layui.$('input[name="status"]').val() != 0);
        layui.form.render();
        layui.form.on("switch(status)", function (data) {
            layui.$('input[name="status"]').val(this.checked ? 1 : 0);
        });
    })

    //提交事件
    layui.use(["form", "popup"], function () {
        layui.form.on("submit(save)", function (data) {
            layui.$.ajax({
                url: INSERT_API,
                type: "POST",
                dateType: "json",
                data: data.field,
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    return layui.popup.success(getText("操作成功"), function () {
                        parent.refreshTable();
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                    });
                }
            });
            return false;
        });
    });

</script>

</body>
</html>
