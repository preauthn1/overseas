<script>
    const SELECT_API = "/app/admin/config/get";
    // 基础设置
    layui.use(["upload", "layer", "popup"], function () {
        let $ = layui.$;
        let form = layui.form;

        function initImg(id) {
            let input = $("#" + id).prev();
            input.prev().attr("src", input.val());
            layui.$("#attachment-choose-" + id).on("click", function () {
                parent.layer.open({
                    type: 2,
                    title: getText("选择附件"),
                    content: "/app/admin/upload/attachment?ext=jpg,jpeg,png,gif,bmp",
                    area: ["95%", "90%"],
                    success: function (layero, index) {
                        parent.layui.$("#layui-layer" + index).data("callback", function (data) {
                            input.val(data.url).prev().attr("src", data.url);
                        });
                    }
                });
            });
            layui.upload.render({
                elem: "#" + id,
                url: "/app/admin/upload/avatar",
                acceptMime: "image/gif,image/jpeg,image/jpg,image/png",
                done: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    this.item.prev().val(res.data.url).prev().attr("src", res.data.url);
                }
            });
        }

        initImg("icon");
        initImg("image");
        // 提交
        form.on("submit(saveBaseInfo)", function (data) {
            $.ajax({
                url: "/app/admin/config/update",
                dataType: "json",
                type: "POST",
                data: {logo: data.field},
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    return layui.popup.success(getText("操作成功"));
                }
            });
            return false;
        });
    });
    // 用户前端
    layui.use(["upload", "layer", "popup"], function () {
        let $ = layui.$;
        let form = layui.form;

        function initImg(id) {
            let input = $("#" + id).prev();
            input.prev().attr("src", input.val());
            layui.$("#attachment-choose-" + id).on("click", function () {
                parent.layer.open({
                    type: 2,
                    title: getText("选择附件"),
                    content: "/app/admin/upload/attachment?ext=jpg,jpeg,png,gif,bmp",
                    area: ["95%", "90%"],
                    success: function (layero, index) {
                        parent.layui.$("#layui-layer" + index).data("callback", function (data) {
                            input.val(data.url).prev().attr("src", data.url);
                        });
                    }
                });
            });
            layui.upload.render({
                elem: "#" + id,
                url: "/app/admin/upload/avatar",
                acceptMime: "image/gif,image/jpeg,image/jpg,image/png",
                done: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    this.item.prev().val(res.data.url).prev().attr("src", res.data.url);
                }
            });
        }

        initImg("logo");
        // 提交
        form.on("submit(saveWebInfo)", function (data) {
            $.ajax({
                url: "/app/admin/config/update",
                dataType: "json",
                type: "POST",
                data: {web: data.field},
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    return layui.popup.success(getText("操作成功"));
                }
            });
            return false;
        });
    });
    // 用户前端
    layui.use(["upload", "layer", "popup"], function () {
        let $ = layui.$;
        let form = layui.form;
        // 提交
        form.on("submit(saveWalletInfo)", function (data) {
            $.ajax({
                url: "/app/admin/config/update",
                dataType: "json",
                type: "POST",
                data: {wallet: data.field},
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    return layui.popup.success(getText("操作成功"));
                }
            });
            return false;
        });
    });

    layui.use(["form"], function () {
        let form = layui.form;
        let $ = layui.$;
        $.ajax({
            url: "/app/admin/config/get",
            dataType: "json",
            success: function (res) {
                if (res.code) {
                    return layui.popup.failure(getText(res.msg));
                }
                let data = res.data;
                form.val("baseInfo", data.logo);
                $("#image").prev().val(data.logo.image).prev().attr("src", data.logo.image);
                form.val("webInfo", data.web)
                $("#logo").prev().val(data.web.logo).prev().attr("src", data.web.logo);
                // 字段 reg_code_email
                layui.$("#reg_code_email").attr("checked", layui.$('input[name="reg_code_email"]').val() != 0);
                layui.form.render();
                layui.form.on("switch(reg_code_email)", function (data) {
                    layui.$('input[name="reg_code_email"]').val(this.checked ? 1 : 0);
                });
                // 字段 reg_code_mobile
                layui.$("#reg_code_mobile").attr("checked", layui.$('input[name="reg_code_mobile"]').val() != 0);
                layui.form.render();
                layui.form.on("switch(reg_code_mobile)", function (data) {
                    layui.$('input[name="reg_code_mobile"]').val(this.checked ? 1 : 0);
                });
                // 字段 invitation
                layui.$("#invitation").attr("checked", layui.$('input[name="invitation"]').val() != 0);
                layui.form.render();
                layui.form.on("switch(invitation)", function (data) {
                    layui.$('input[name="invitation"]').val(this.checked ? 1 : 0);
                });
                form.val("walletInfo", data.wallet)

                layui.use(["table"], function () {
                    let table = layui.table;
                    // 表头参数
                    let cols = [
                        {
                            title: getText("币种"),
                            field: "coinName",
                            width: 100,
                        }, {
                            title: getText("链名"),
                            field: "chain",
                            width: 100,
                        }, {
                            title: getText("地址"),
                            field: "address",
                            width: 400,
                        }, {
                            title: getText("余额"),
                            field: "balance",
                        }, {
                            title: 'gas' + getText("余额"),
                            field: "gasBalance",
                        }, {
                            title: getText("状态"),
                            field: "status",
                            width: 100,
                            templet: function (d) {
                                if (d['status'] == 1) {
                                    return getText('启用');
                                }
                                return getText('禁用');
                            }
                        }
                    ];

                    // 渲染表格
                    function render() {
                        table.render({
                            elem: "#data-table",
                            url: SELECT_API,
                            page: false,
                            parseData: function (res) {
                                return {
                                    "code": res.code,
                                    "msg": res.msg,
                                    "count": res.data.total,
                                    "data": res.data.withdrawal_list
                                };
                            },
                            cols: [cols],
                            skin: "line",
                            size: "lg",
                            autoSort: false,
                            text: {
                                none: getText("暂无数据")
                            },
                            done: function () {
                                layer.photos({photos: 'div[lay-id="data-table"]', anim: 5});
                            }
                        });
                    }

                    render();
                })
            }
        });

    });
</script>
