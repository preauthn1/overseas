<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8">
    <title data-lang="浏览页面">浏览页面</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css?v=<?=get_version() ?>"/>
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css?v=<?=get_version() ?>"/>
</head>
<body class="pear-container">

<!-- 顶部查询表单 -->
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form top-search-from">
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="编号">编号</label>
                <div class="layui-input-block">
                    <input type="text" name="number[0]" style="display: none" value="like">
                    <input type="text" name="number[1]" value="" class="layui-input" data-lang="请输入编号"
                           placeholder="请输入编号">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="名称">名称</label>
                <div class="layui-input-block">
                    <input type="text" name="name[0]" style="display: none" value="like">
                    <input type="text" name="name[1]" value="" class="layui-input" data-lang="请输入名称"
                           placeholder="请输入名称">
                </div>
            </div>
            <div class="layui-form-item layui-inline">

                <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="table-query">
                    <i class="layui-icon layui-icon-search"></i><span data-lang="查询">查询</span>
                </button>
                <button type="reset" class="pear-btn pear-btn-md" lay-submit lay-filter="table-reset">
                    <i class="layui-icon layui-icon-refresh"></i><span data-lang="重置">重置</span>
                </button>
            </div>
            <div class="toggle-btn">
                <a class="layui-hide"><span data-lang="展开">展开</span><i class="layui-icon layui-icon-down"></i></a>
                <a class="layui-hide"><span data-lang="收起">收起</span><i class="layui-icon layui-icon-up"></i></a>
            </div>
        </form>
    </div>
</div>

<!-- 数据表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table id="data-table" lay-filter="data-table"></table>
    </div>
</div>

<!-- 表格顶部工具栏 -->
<script type="text/html" id="table-toolbar">
    <button class="pear-btn pear-btn-primary pear-btn-md" lay-event="add" permission="app.admin.fileexport.insert">
        <i class="layui-icon layui-icon-add-1"></i>{{= getText('新增') }}
    </button>
    <button class="pear-btn pear-btn-danger pear-btn-md" lay-event="batchRemove"
            permission="app.admin.fileexport.delete">
        <i class="layui-icon layui-icon-delete"></i>{{= getText('删除') }}
    </button>
</script>

<!-- 表格行工具栏 -->
<script type="text/html" id="table-bar">
    <button class="pear-btn pear-btn-xs tool-btn" lay-event="export" permission="app.admin.fileexport.export">{{=
        getText('下载文件') }}
    </button>
    <button class="pear-btn pear-btn-xs tool-btn" lay-event="remove" permission="app.admin.fileexport.delete">{{=
        getText('删除') }}
    </button>
</script>

<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script src="/app/admin/admin/js/permission.js"></script>
<script src="/app/admin/admin/js/common.js"></script>
<script>

    // 相关常量
    const PRIMARY_KEY = "id";
    const SELECT_API = "/app/admin/fileexport/select";
    const DELETE_API = "/app/admin/fileexport/delete";

    // 表格渲染
    layui.use(["table", "form", "common", "popup", "util"], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.$;
        // 表头参数
        let cols = [
            {
                title: getText("主键"),
                field: "id",
                sort: true,
            }, {
                title: getText("编号"),
                field: "number",
            }, {
                title: getText("名称"),
                field: "name",
            }, {
                title: getText("下载地址"),
                field: "url",
            }, {
                title: getText("页码"),
                field: "file_page",
                templet: function (d) {
                    return d.file_page - 1;
                }
            }, {
                title: getText("状态"),
                field: "status",
                templet: function (d) {
                    //0未开始 1进行中 2已完成 3导出错误
                    let str = "";
                    switch (d.status) {
                        case 0:
                            str = getText("未开始");
                            break;
                        case 1:
                            str = getText("进行中");
                            break;
                        case 2:
                            str = getText("已完成");
                            break;
                        case 3:
                            str = getText("导出错误");
                            break;
                    }
                    return str;
                }
            }, {
                title: getText("更新时间"),
                field: "updated_at",
            }, {
                title: getText("操作"),
                toolbar: "#table-bar",
                align: "center",
                fixed: "right",
                width: 330,
            }
        ];

        // 渲染表格
        function render() {
            table.render({
                elem: "#data-table",
                url: SELECT_API,
                page: {
                    layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip'],
                    groups: 5,
                    first: getText("首页"),
                    last: getText("尾页"),
                    prev: getText("上一页"),
                    next: getText("下一页"),
                    limits: [10, 20, 30, 40, 50],
                    limit: 10,
                    limitTemplet: function (curr, limit) {
                        return curr + " " + getText("条/页");
                    },
                    // limitTips: [getText("当前页"), getText("条/页"), getText("共"), getText("条")],
                    skipText: [getText("跳转"), '', getText("确认")],
                    countText: [getText("共") + " ", " " + getText("页")]
                },
                cols: [cols],
                skin: "line",
                size: "lg",
                // toolbar: "#table-toolbar",
                autoSort: false,
                text: {
                    none: getText("暂无数据")
                },
                defaultToolbar: [{
                    title: getText("刷新"),
                    layEvent: "refresh",
                    icon: "layui-icon-refresh",
                }, "filter", "print", "exports"],
                done: function () {
                    layer.photos({photos: 'div[lay-id="data-table"]', anim: 5});
                }
            });
        }

        // 下载文件
        table.on("tool(data-table)", function (obj) {
            if (obj.event === "export") {
                //下载文件
                window.open(obj.data.url);
            } else if (obj.event === "remove") {
                remove(obj);
            }
        });
        // 表格顶部搜索事件
        form.on("submit(table-query)", function (data) {
            table.reload("data-table", {
                page: {
                    curr: 1
                },
                where: data.field
            })
            return false;
        });

        // 表格顶部搜索重置事件
        form.on("submit(table-reset)", function (data) {
            table.reload("data-table", {
                where: []
            })
        });

        // 表格排序事件
        table.on("sort(data-table)", function (obj) {
            table.reload("data-table", {
                initSort: obj,
                scrollPos: "fixed",
                where: {
                    field: obj.field,
                    order: obj.type
                }
            });
        });
        // 删除一行
        let remove = function (obj) {
            return doRemove(obj.data[PRIMARY_KEY]);
        }
        // 执行删除
        let doRemove = function (ids) {
            let data = {};
            data[PRIMARY_KEY] = ids;
            layer.confirm(getText("确定删除?"), {
                icon: 3,
                title: getText("提示")
            }, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: DELETE_API,
                    data: data,
                    dataType: "json",
                    type: "post",
                    success: function (res) {
                        layer.close(loading);
                        if (res.code) {
                            return layui.popup.failure(getText(res.msg));
                        }
                        return layui.popup.success(getText("操作成功"), refreshTable);
                    }
                })
            });
        }
        // 刷新表格数据
        window.refreshTable = function () {
            table.reloadData("data-table", {
                scrollPos: "fixed",
                done: function (res, curr) {
                    if (curr > 1 && res.data && !res.data.length) {
                        curr = curr - 1;
                        table.reloadData("data-table", {
                            page: {
                                curr: curr
                            },
                        })
                    }
                }
            });
        }
        render();
    })

</script>
</body>
</html>
