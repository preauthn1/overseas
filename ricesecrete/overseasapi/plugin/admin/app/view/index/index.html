<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>

<script src="/plugin/webman/push/push.js"></script>
<!-- 框 架 初 始 化 -->
<script>

    // Admin
    window.Admin = {
        Account: {}
    };

    layui.use(["admin", "jquery", "popup", "drawer"], function () {
        var $ = layui.$;
        var admin = layui.admin;
        var popup = layui.popup;
        admin.setConfigType("json");
        admin.setConfigPath("/app/admin/config/get");

        admin.render();

        // 登出逻辑
        admin.logout(function () {
            $.ajax({
                url: "/app/admin/account/logout",
                dataType: "json",
                success: function (res) {
                    if (res.code) {
                        return popup.error(res.msg);
                    }
                    popup.success("注销成功", function () {
                        location.reload();
                    })
                }
            });
            return false;
        })
        $.ajax({
            url: "/app/admin/account/info",
            dataType: 'json',
            success: function (res) {
                window.Admin.Account = res.data;
                $("#recharge_count").text(res.data.wait_recharge);
                $("#withdraw_count").text(res.data.wait_withdraw);
                if (parseInt(res.data.wait_recharge) + parseInt(res.data.wait_withdraw) > 0) {
                    $("#recharge_withdraw_count").show();
                } else {
                    $("#recharge_withdraw_count").hide();
                }
            }
        });
        var language = {
            "zh-CN": "简体中文",
            "en": "English"
        };
        var languagePacks = {};

        // 语言切换函数（可选）
        function switchLanguage(lang) {
            languagePacks = JSON.parse(localStorage.getItem("admin_language_packs"));
            localStorage.setItem('admin_language', lang);
            let currentDisplayLang = "语言";
            // 查找当前语言对应的显示名称
            $.each(language, function (index, langItem) {
                if (langItem.lang == lang) {
                    currentDisplayLang = langItem.title;
                    return false; // 跳出循环
                }
            });
            // 更新语言按钮显示文本
            $('#switch-lang-text').text(currentDisplayLang);
            // 重新应用语言
            $('[data-lang]').each(function () {
                var langKey = $(this).data('lang');
                var text = getText(langKey);
                if (this.tagName === 'INPUT' || this.tagName === 'TEXTAREA') {
                    $(this).attr('placeholder', text);
                } else {
                    $(this).text(text);
                }
            });
        }

        /**
         * 刷新本地语言包
         */
        function updateLanguagePacks() {
            $.ajax({
                url: "/app/admin/index/get_lang",
                dataType: 'json',
                success: function (res) {
                    languagePacks = res.data.list;
                    language = res.data.lang;
                    localStorage.setItem("admin_language_packs", JSON.stringify(languagePacks))
                    var lang = localStorage.getItem('admin_language');
                    switchLanguage(lang ?? "zh-CN");
                    // 生成语言切换菜单
                    if (language) {
                        generateLanguageMenu(language);
                    }
                }
            });
        }

        // 动态生成语言切换菜单
        function generateLanguageMenu(langData) {
            var languageMenuHtml = '';
            var defaultLang = 'zh-CN';
            var currentDisplayLang = '语言';

            // 查找默认语言
            $.each(langData, function (index, langItem) {
                if (langItem.is_default == 1) {
                    defaultLang = langItem.lang;
                    currentDisplayLang = langItem.title;
                }
            });

            // 生成菜单项
            $.each(langData, function (index, langItem) {
                languageMenuHtml += '<dd><a href="javascript:void(0);" class="switch-lang" data-lang-code="' + langItem.lang + '">' + langItem.title + '</a></dd>';
            });

            // 插入到语言菜单中
            $('#language-menu').html(languageMenuHtml);
            // 设置当前语言或默认语言
            var currentLang = localStorage.getItem('admin_language') || defaultLang;
            switchLanguage(currentLang);
        }

        updateLanguagePacks();
        // 语言切换事件绑定
        $(document).on('click', '.switch-lang', function () {
            var lang = $(this).data('lang-code');
            switchLanguage(lang);
            location.reload();
        });

        // 确保 Push 类已定义后再执行
        if (typeof Push !== 'undefined') {
            // 建立连接
            var connection = new Push({
                url: 'ws://ws.webmanshop.com',
                app_key: 'f49fc68dc849bcc0dfe9cdb047d237ad',
                auth: 'http://api.webmanshop.com/plugin/webman/push/auth'
            });
            // 监听充值提现订阅消息
            var recharge_withdraw_channel = connection.subscribe('group-' + 'recharge_withdraw');

            recharge_withdraw_channel.on('message', function (data) {
                // data里是消息内容
                console.log(data);
                if (data.type == 10) {
                    //充值待审核
                    $("#recharge_count").text(data.data);
                    $("#recharge_withdraw_count").show();
                    // console.log("充值待审核")
                    var rechargeSound = document.getElementById('rechargeSound');
                    if (rechargeSound) {
                        rechargeSound.play().catch(function (error) {
                            console.log('Audio play failed:', error);
                        });
                    }
                }
                if (data.type == 101) {
                    //充值待审核
                    $("#recharge_count").text(data.data);
                }
                if (data.type == 11) {
                    //提现待审核
                    $("#withdraw_count").text(data.data);
                    // console.log("提现待审核")
                    var withdrawSound = document.getElementById('withdrawSound');
                    if (withdrawSound) {
                        withdrawSound.play().catch(function (error) {
                            console.log('Audio play failed:', error);
                        });
                    }
                    $("#recharge_withdraw_count").show();
                }
                if (data.type == 111) {
                    //提现待审核
                    $("#withdraw_count").text(data.data);
                }
                if (data.type == 9) {
                    //充值成功
                    // console.log("充值成功")
                    var rechargeSuccessSound = document.getElementById('rechargeSuccessSound');
                    if (rechargeSuccessSound) {
                        rechargeSuccessSound.play().catch(function (error) {
                            console.log('Audio play failed:', error);
                        });
                    }
                }
            });
        } else {
            console.warn('Push library not available');
        }
    });
</script>
