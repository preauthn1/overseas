<script src="/app/admin/admin/js/permission.js"></script>
<script>

    // 相关接口
    const INSERT_API = "/app/admin/langItem/insert";
    // 字段 文件 url
    layui.use(["layer", "popup", "util"], function () {
        let $ = layui.$;
        let layer = layui.layer;
        let translateBtn = $("#translate");
        translateBtn.on('click', function () {
            let title = $('input[name=title]').val();
            if (!title) {
                layui.popup.failure(getText("请先填写条目名称"));
                return;
            }

            // 显示加载提示
            layer.load(1, {shade: [0.1, '#fff']});

            // 发起翻译请求
            $.ajax({
                type: 'POST',
                url: '/app/admin/dict/translate',
                data: {text: title},
                dataType: 'json',
                success: function (res) {
                    layer.closeLast('loading');
                    if (res.code) {
                        layui.popup.failure(res.msg);
                        return;
                    }
                    layui.each(res.data, function (key, value) {
                        let obj = $('*[name="' + key + '"]');
                        obj.attr("value", value);
                    });
                    layui.popup.success(getText("翻译完成"));
                },
                error: function (xhr, type) {
                    layer.closeLast('loading');
                    layui.popup.failure(getText("翻译请求失败"));
                }
            });
        })
    });

    //提交事件
    layui.use(["form", "popup"], function () {
        layui.form.on("submit(save)", function (data) {
            layui.$.ajax({
                url: INSERT_API,
                type: "POST",
                dateType: "json",
                data: data.field,
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    return layui.popup.success(getText("操作成功"), function () {
                        parent.refreshTable();
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                    });
                }
            });
            return false;
        });
    });

</script>

</body>
</html>
