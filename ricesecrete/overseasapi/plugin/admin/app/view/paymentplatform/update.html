<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>更新页面</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css?v=<?=get_version() ?>"/>
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css?v=<?=get_version() ?>"/>
</head>
<body>

<form class="layui-form">
    <div class="mainBox">
        <div class="main-container mr-5">
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="类型">类型</label>
                <div class="layui-input-block">
                    <input type="radio" name="type" lay-filter="type" value="1" title="数字钱包" data-lang="数字钱包" checked>
                    <input type="radio" name="type" lay-filter="type" value="2" title="三方渠道" data-lang="三方渠道">
                    <input type="radio" name="type" lay-filter="type" value="3" title="线下支付" data-lang="线下支付">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="名称">名称</label>
                <div class="layui-input-block">
                    <input type="text" name="name" value="" required lay-verify="required" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="包名">包名</label>
                <div class="layui-input-block">
                    <input type="text" name="package" value="" required lay-verify="required" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="货币单位">货币单位</label>
                <div class="layui-input-block">
                    <input type="text" name="unit" value="" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="汇率">汇率</label>
                <div class="layui-input-block">
                    <input type="text" name="exchange_rate" value="" class="layui-input">
                    <div class="layui-form-mid layui-word-aux" data-lang="1平台币/1U 的值(如 2平台币=1U 值就是2)">1平台币/1U 的值(如 2平台币=1U 值就是2)
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="收款地址">收款地址</label>
                <div class="layui-input-block">
                    <input type="text" name="address" value="" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="图片">图片</label>
                <div class="layui-input-block">
                    <input type="text" style="display:none" name="image" value=""/>
                    <button type="button" class="pear-btn pear-btn-primary pear-btn-sm" id="image">
                        <i class="layui-icon layui-icon-upload"></i><span data-lang="上传文件">上传文件</span>
                    </button>
                    <button type="button" class="pear-btn pear-btn-danger pear-btn-sm" id="deleteImage"
                            style="display:none;margin-left: 10px;">
                        <i class="layui-icon layui-icon-delete"></i><span data-lang="删除图片">删除图片</span>
                    </button>
                    <div id="imagePreview" style="margin-top: 10px;display:none;">
                        <img src="" style="max-width: 200px;max-height: 200px;border: 1px solid #eee;padding: 5px;">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="排序">排序</label>
                <div class="layui-input-block">
                    <input type="number" name="sort" placeholder="请输入排序" data-lang="请输入排序" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="最小充值金额">最小充值金额</label>
                <div class="layui-input-block">
                    <input type="text" name="min_recharge_money" value="" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="最大充值金额">最大充值金额</label>
                <div class="layui-input-block">
                    <input type="text" name="max_recharge_money" value="" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="最小提现金额">最小提现金额</label>
                <div class="layui-input-block">
                    <input type="text" name="min_withdraw_money" value="" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="最大提现金额">最大提现金额</label>
                <div class="layui-input-block">
                    <input type="text" name="max_withdraw_money" value="" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="提现手续费">提现手续费</label>
                <div class="layui-input-block">
                    <input type="text" name="fees" value="" class="layui-input">
                    <div class="layui-form-mid layui-word-aux" data-lang="百分比">百分比</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="快捷金额">快捷金额</label>
                <div class="layui-input-block">
                    <input type="text" name="fast_amount" value="" class="layui-input">
                    <div class="layui-form-mid layui-word-aux" data-lang="多个金额用英文逗号隔开 100,200,300">多个金额用英文逗号隔开
                        100,200,300
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="说明">说明</label>
                <div class="layui-input-block">
                    <input type="text" name="instruction" placeholder="请输入说明" data-lang="请输入说明" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="配置数据">配置数据</label>
                <div class="layui-input-block">
                    <textarea name="config" placeholder="请输入配置数据" data-lang="请输入配置数据" class="layui-textarea"></textarea>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="充值状态">充值状态</label>
                <div class="layui-input-block">
                    <input type="checkbox" id="recharge_is_show" lay-filter="recharge_is_show" lay-skin="switch"
                           lay-text="启用|禁用" data-lang="启用|禁用"/>
                    <input type="text" style="display:none" name="recharge_is_show" value="0" lay-text="启用|禁用"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="提现状态">提现状态</label>
                <div class="layui-input-block">
                    <input type="checkbox" id="withdraw_is_show" lay-filter="withdraw_is_show" lay-skin="switch"
                           lay-text="启用|禁用" data-lang="启用|禁用"/>
                    <input type="text" style="display:none" name="withdraw_is_show" value="0" lay-text="启用|禁用"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="状态">状态</label>
                <div class="layui-input-block">
                    <input type="checkbox" id="status" lay-filter="status" lay-skin="switch" lay-text="启用|禁用"
                           data-lang="启用|禁用"/>
                    <input type="text" style="display:none" name="status" value="0" lay-text="启用|禁用"/>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="pear-btn pear-btn-primary pear-btn-md" lay-submit="" lay-filter="save">
                <span data-lang="提交">提交</span>
            </button>
            <button type="reset" class="pear-btn pear-btn-md">
                <span data-lang="重置">重置</span>
            </button>
        </div>
    </div>

</form>

<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script src="/app/admin/admin/js/permission.js"></script>
<script>

    // 相关接口
    const PRIMARY_KEY = "id";
    const SELECT_API = "/app/admin/paymentPlatform/select" + location.search;
    const UPDATE_API = "/app/admin/paymentPlatform/update";
    // 获取数据库记录
    layui.use(["form", "util", "popup"], function () {
        let $ = layui.$;
        $.ajax({
            url: SELECT_API,
            dataType: "json",
            success: function (res) {

                // 给表单初始化数据
                layui.each(res.data[0], function (key, value) {
                    let obj = $('*[name="' + key + '"]');
                    if (key === "password") {
                        obj.attr("placeholder", getText('不更新密码请留空'));
                        return;
                    }
                    if (typeof obj[0] === "undefined" || !obj[0].nodeName) return;
                    if (obj[0].nodeName.toLowerCase() === "textarea") {
                        obj.val(value);
                    } else if (obj[0].nodeName.toLowerCase() === "input" && obj.attr("type") === "radio") {
                        // 处理radio选中
                        obj.each(function () {
                            if ($(this).val() == value) {
                                $(this).prop("checked", true);
                            }
                        });
                        // 重新渲染表单以显示选中状态
                        layui.form.render('radio');
                    } else {
                        obj.attr("value", value);
                    }
                });
                let oldtype = "";
                // 字段 禁用 status
                layui.use(["form"], function () {
                    layui.form.on("radio(type)", function (data) {
                        var packageInput = layui.$('input[name="package"]');
                        if (data.value == '3') { // 线下支付
                            if (oldtype == "") {
                                oldtype = packageInput.val();
                            }
                            packageInput.val('OfflinePay');
                            packageInput.attr('readonly', 'readonly');
                            packageInput.addClass('layui-disabled');
                        } else {
                            packageInput.removeAttr('readonly');
                            packageInput.removeClass('layui-disabled');
                            if (oldtype) {
                                packageInput.val(oldtype);
                            }
                        }
                    });
                    layui.$("#status").attr("checked", layui.$('input[name="status"]').val() != 0);
                    layui.form.on("switch(status)", function (data) {
                        layui.$('input[name="status"]').val(this.checked ? 1 : 0);
                    });
                    layui.$("#recharge_is_show").attr("checked", layui.$('input[name="recharge_is_show"]').val() != 0);
                    layui.form.on("switch(recharge_is_show)", function (data) {
                        layui.$('input[name="recharge_is_show"]').val(this.checked ? 1 : 0);
                    });
                    layui.$("#withdraw_is_show").attr("checked", layui.$('input[name="withdraw_is_show"]').val() != 0);

                    layui.form.on("switch(withdraw_is_show)", function (data) {
                        layui.$('input[name="withdraw_is_show"]').val(this.checked ? 1 : 0);
                    });
                    layui.form.render();
                })
// 字段 文件 image
                layui.use(["upload", "layer", "popup", "util"], function () {
                    let $ = layui.$;
                    let input = $("#image").prev();
                    let deleteBtn = $("#deleteImage");
                    let previewContainer = $("#imagePreview");
                    let previewImg = previewContainer.find('img');

                    // 初始化显示
                    function initDisplay() {
                        let imgUrl = input.val();
                        if (imgUrl) {
                            previewImg.attr('src', imgUrl);
                            previewContainer.show();
                            deleteBtn.show();
                        } else {
                            previewContainer.hide();
                            deleteBtn.hide();
                        }
                    }

                    // 初始调用
                    initDisplay();

                    // 上传功能
                    layui.upload.render({
                        elem: "#image",
                        url: "/app/admin/upload/file",
                        data: {
                            folder: "/hkxa/pay/"
                        },
                        accept: "file",
                        field: "__file__",
                        done: function (res) {
                            if (res.code) return layui.popup.failure(getText(res.msg));
                            $('input[name="image"]').val(res.data.url);
                            initDisplay(); // 更新显示
                            parent.refreshTable();
                        }
                    });
                    // 删除功能
                    deleteBtn.on('click', function () {
                        layui.layer.confirm(getText('确定要删除这张图片吗？'), function (index) {
                            input.val('');
                            initDisplay(); // 更新显示
                            layui.layer.close(index);
                        });
                    });
                });
                // ajax产生错误
                if (res.code) {
                    layui.popup.failure(res.msg);
                }

            }
        });
    });

    //提交事件
    layui.use(["form", "popup"], function () {
        layui.form.on("submit(save)", function (data) {
            data.field[PRIMARY_KEY] = layui.url().search[PRIMARY_KEY];
            layui.$.ajax({
                url: UPDATE_API,
                type: "POST",
                dateType: "json",
                data: data.field,
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    return layui.popup.success(getText("操作成功"), function () {
                        parent.refreshTable();
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                    });
                }
            });
            return false;
        });
    });

</script>

</body>

</html>
