<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8">
    <title>浏览页面</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css?v=<?=get_version() ?>"/>
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css?v=<?=get_version() ?>"/>
</head>
<body class="pear-container">

<!-- 顶部查询表单 -->
<div class="layui-card">
    <div class="layui-card-body">
        <form class="layui-form top-search-from">
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="像素">像素</label>
                <div class="layui-input-block">
                    <input type="text" name="pix[0]" style="display: none" value="like" class="layui-input">
                    <input type="text" name="pix[1]" value="" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="用户id">用户id</label>
                <div class="layui-input-inline">
                    <input type="text" name="user_id" placeholder="请输入用户id" data-lang="请输入用户id" autocomplete="off"
                           class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="用户名">用户名</label>
                <div class="layui-input-block">
                    <input type="text" name="username" placeholder="请输入用户明" data-lang="请输入用户明" autocomplete="off"
                           class="layui-input">
                </div>
            </div>
            <div class="layui-form-item layui-inline">

                <button class="pear-btn pear-btn-md pear-btn-primary" lay-submit lay-filter="table-query">
                    <i class="layui-icon layui-icon-search"></i><span data-lang="查询">查询</span>
                </button>
                <button type="reset" class="pear-btn pear-btn-md" lay-submit lay-filter="table-reset">
                    <i class="layui-icon layui-icon-refresh"></i><span data-lang="重置">重置</span>
                </button>
            </div>
            <div class="toggle-btn">
                <a class="layui-hide" data-lang="展开">展开<i class="layui-icon layui-icon-down"></i></a>
                <a class="layui-hide" data-lang="收起">收起<i class="layui-icon layui-icon-up"></i></a>
            </div>
        </form>
    </div>
</div>

<!-- 数据表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table id="data-table" lay-filter="data-table"></table>
    </div>
</div>

<!-- 表格顶部工具栏 -->
<script type="text/html" id="table-toolbar">
    <button class="pear-btn pear-btn-primary pear-btn-md" lay-event="add" permission="app.admin.userLevel.insert">
        <i class="layui-icon layui-icon-add-1"></i>{{= getText('新增') }}
    </button>
    <button class="pear-btn pear-btn-danger pear-btn-md" lay-event="batchRemove"
            permission="app.admin.userLevel.delete">
        <i class="layui-icon layui-icon-delete"></i>{{= getText('删除') }}
    </button>
</script>

<!-- 表格行工具栏 -->
<script type="text/html" id="table-bar">
    <button class="pear-btn pear-btn-xs tool-btn" lay-event="edit" permission="app.admin.userLevel.update">{{=
        getText('编辑') }}
    </button>
    <button class="pear-btn pear-btn-xs tool-btn" lay-event="remove" permission="app.admin.userLevel.delete">{{=
        getText('删除') }}
    </button>
</script>

<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script src="/app/admin/admin/js/permission.js"></script>
<script src="/app/admin/admin/js/common.js"></script>
<script>

    // 相关常量
    const PRIMARY_KEY = "id";
    const SELECT_API = "/app/admin/promotion/select";
    const UPDATE_API = "/app/admin/promotion/update";
    const DELETE_API = "/app/admin/promotion/delete";
    const INSERT_URL = "/app/admin/promotion/insert";
    const UPDATE_URL = "/app/admin/promotion/update";

    // 表格渲染
    layui.use(["table", "form", "common", "popup", "util"], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.$;
        let common = layui.common;
        let util = layui.util;

        // 表头参数
        let cols = [
            {
                type: "checkbox"
            }, {
                title: getText("主键"),
                field: "id",
                width: 100,
            }, {
                title: getText("用户信息"),
                field: "user_id",
                templet: function (d) {
                    return '' + d['user_id'] + "/" + d['user_info']['username'];
                }
            }, {
                title: getText("渠道名称"),
                field: "platform",
            }, {
                title: getText("像素"),
                field: "pix",
                width: 220,
            }, {
                title: getText("推广地址"),
                field: "url",
                width: 360,
            }, {
                title: getText("是否默认"),
                field: "is_default",
                templet: function (d) {
                    return d.is_default == 1 ? getText("是") : getText("否");
                }
            }, {
                title: getText("状态"),
                field: "status",
                templet: function (d) {
                    let field = "status";
                    form.on("switch(" + field + ")", function (data) {
                        let load = layer.load();
                        let postData = {};
                        postData[field] = data.elem.checked ? 1 : 0;
                        postData[PRIMARY_KEY] = this.value;
                        $.post(UPDATE_API, postData, function (res) {
                            layer.close(load);
                            if (res.code) {
                                return layui.popup.failure(getText(res.msg), function () {
                                    data.elem.checked = !data.elem.checked;
                                    form.render();
                                });
                            }
                            return layui.popup.success(getText("操作成功"));
                        })
                    });
                    let checked = d[field] === 1 ? "checked" : "";
                    return '<input type="checkbox" value="' + util.escape(d[PRIMARY_KEY]) + '" lay-filter="' + util.escape(field) + '" lay-skin="switch" lay-text="' + getText('启用|禁用') + '"' + checked + '/>';
                }
            }, {
                title: getText("创建时间"),
                field: "created_at",
                hide: true,
            }, {
                title: getText("更新时间"),
                field: "updated_at",
            }, {
                title: getText("操作"),
                toolbar: "#table-bar",
                align: "center",
                fixed: "right",
                width: 130,
            }
        ];

        // 渲染表格
        function render() {
            table.render({
                elem: "#data-table",
                url: SELECT_API,
                page: {
                    layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip'],
                    groups: 5,
                    first: getText("首页"),
                    last: getText("尾页"),
                    prev: getText("上一页"),
                    next: getText("下一页"),
                    limits: [10, 20, 30, 40, 50],
                    limit: 10,
                    limitTemplet: function (curr, limit) {
                        return curr + " " + getText("条/页");
                    },
                    // limitTips: [getText("当前页"), getText("条/页"), getText("共"), getText("条")],
                    skipText: [getText("跳转"), '', getText("确认")],
                    countText: [getText("共") + " ", " " + getText("页")]
                },
                cols: [cols],
                skin: "line",
                size: "lg",
                toolbar: "#table-toolbar",
                autoSort: false,
                text: {
                    none: getText("暂无数据")
                },
                defaultToolbar: [{
                    title: getText("刷新"),
                    layEvent: "refresh",
                    icon: "layui-icon-refresh",
                }, "filter", "print", "exports"],
                done: function () {
                    layer.photos({photos: 'div[lay-id="data-table"]', anim: 5});
                }
            });
        }

        // 编辑或删除行事件
        table.on("tool(data-table)", function (obj) {
            if (obj.event === "remove") {
                remove(obj);
            } else if (obj.event === "edit") {
                edit(obj);
            }
        });

        // 表格顶部工具栏事件
        table.on("toolbar(data-table)", function (obj) {
            if (obj.event === "add") {
                add();
            } else if (obj.event === "refresh") {
                refreshTable();
            } else if (obj.event === "batchRemove") {
                batchRemove(obj);
            }
        });

        // 表格顶部搜索事件
        form.on("submit(table-query)", function (data) {
            table.reload("data-table", {
                page: {
                    curr: 1
                },
                where: data.field
            })
            return false;
        });

        // 表格顶部搜索重置事件
        form.on("submit(table-reset)", function (data) {
            table.reload("data-table", {
                where: []
            })
        });

        // 表格排序事件
        table.on("sort(data-table)", function (obj) {
            table.reload("data-table", {
                initSort: obj,
                scrollPos: "fixed",
                where: {
                    field: obj.field,
                    order: obj.type
                }
            });
        });

        // 表格新增数据
        let add = function () {
            layer.open({
                type: 2,
                title: getText("新增"),
                shade: 0.1,
                area: [common.isModile() ? "100%" : "700px", common.isModile() ? "100%" : "550px"],
                content: INSERT_URL
            });
        }

        // 表格编辑数据
        let edit = function (obj) {
            let value = obj.data[PRIMARY_KEY];
            layer.open({
                type: 2,
                title: getText("修改"),
                shade: 0.1,
                area: [common.isModile() ? "100%" : "700px", common.isModile() ? "100%" : "550px"],
                content: UPDATE_URL + "?" + PRIMARY_KEY + "=" + value
            });
        }

        // 删除一行
        let remove = function (obj) {
            return doRemove(obj.data[PRIMARY_KEY]);
        }

        // 删除多行
        let batchRemove = function (obj) {
            let checkIds = common.checkField(obj, PRIMARY_KEY);
            if (checkIds === "") {
                layui.popup.warning(getText("未选中数据"));
                return false;
            }
            doRemove(checkIds.split(","));
        }

        // 执行删除
        let doRemove = function (ids) {
            let data = {};
            data[PRIMARY_KEY] = ids;
            layer.confirm(getText("确定删除?"), {
                icon: 3,
                title: getText("提示")
            }, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: DELETE_API,
                    data: data,
                    dataType: "json",
                    type: "post",
                    success: function (res) {
                        layer.close(loading);
                        if (res.code) {
                            return layui.popup.failure(getText(res.msg));
                        }
                        return layui.popup.success(getText("操作成功"), refreshTable);
                    }
                })
            });
        }

        // 刷新表格数据
        window.refreshTable = function () {
            table.reloadData("data-table", {
                scrollPos: "fixed",
                done: function (res, curr) {
                    if (curr > 1 && res.data && !res.data.length) {
                        curr = curr - 1;
                        table.reloadData("data-table", {
                            page: {
                                curr: curr
                            },
                        })
                    }
                }
            });
        }
        render();
    })

</script>
</body>
</html>
