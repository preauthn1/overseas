<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>更新页面</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css?v=<?=get_version() ?>"/>
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css?v=<?=get_version() ?>"/>
</head>
<body>

<form class="layui-form">
    <div class="mainBox">
        <div class="main-container mr-5">
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="用户id">用户id</label>
                <div class="layui-input-block">
                    <input type="text" name="user_id" value="" disabled class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="平台">平台</label>
                <div class="layui-input-block">
                    <select name="platform" lay-verify="required" class="layui-select">
                        <option value="facebook">facebook</option>
                        <option value="kwai">kwai</option>
                        <option value="tiktok">tiktok</option>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="像素">像素</label>
                <div class="layui-input-block">
                    <input type="text" name="pix" value="" required lay-verify="required" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">Token</label>
                <div class="layui-input-block">
                    <input type="text" name="access_token" value="" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="测试事件">测试事件</label>
                <div class="layui-input-block">
                    <input type="text" name="test_event_code" value="" class="layui-input">
                    <div class="layui-form-mid layui-word-aux" data-lang="测试用,对接完后请删除">测试用,对接完后请删除</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="域名">域名</label>
                <div class="layui-input-block">
                    <input type="text" name="domain" value="" class="layui-input">
                    <div class="layui-form-mid layui-word-aux">https://www.hkxahxcoin.com/</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="是否默认">是否默认</label>
                <div class="layui-input-block">
                    <input type="checkbox" id="is_default" lay-filter="is_default" lay-skin="switch" lay-text="启用|禁用"
                           data-lang="启用|禁用"/>
                    <input type="text" style="display:none" name="is_default" value="0" lay-text="启用|禁用"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="状态">状态</label>
                <div class="layui-input-block">
                    <input type="checkbox" id="status" lay-filter="status" lay-skin="switch" lay-text="启用|禁用"
                           data-lang="启用|禁用"/>
                    <input type="text" style="display:none" name="status" value="0" lay-text="启用|禁用"/>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="pear-btn pear-btn-primary pear-btn-md" lay-submit="" lay-filter="save">
                <span data-lang="提交">提交</span>
            </button>
            <button type="reset" class="pear-btn pear-btn-md">
                <span data-lang="重置">重置</span>
            </button>
        </div>
    </div>

</form>

<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script src="/app/admin/admin/js/permission.js"></script>
<script>

    // 相关接口
    const PRIMARY_KEY = "id";
    const SELECT_API = "/app/admin/promotion/select" + location.search;
    const UPDATE_API = "/app/admin/promotion/update";

    // 获取数据库记录
    layui.use(["form", "util", "popup"], function () {
        let $ = layui.$;
        $.ajax({
            url: SELECT_API,
            dataType: "json",
            success: function (res) {

                // 给表单初始化数据
                layui.each(res.data[0], function (key, value) {
                    let obj = $('*[name="' + key + '"]');
                    if (key === "password") {
                        obj.attr("placeholder", getText("不更新密码请留空"));
                        return;
                    }
                    if (typeof obj[0] === "undefined" || !obj[0].nodeName) return;
                    if (obj[0].nodeName.toLowerCase() === "textarea") {
                        obj.val(layui.util.escape(value));
                    } else {
                        obj.attr("value", value);
                    }
                });
                // 字段 禁用 status
                layui.use(["form"], function () {
                    layui.$("#status").attr("checked", layui.$('input[name="status"]').val() != 0);
                    layui.form.render();
                    layui.form.on("switch(status)", function (data) {
                        layui.$('input[name="status"]').val(this.checked ? 1 : 0);
                    });
                    layui.$("#is_default").attr("checked", layui.$('input[name="is_default"]').val() != 0);
                    layui.form.render();
                    layui.form.on("switch(is_default)", function (data) {
                        layui.$('input[name="is_default"]').val(this.checked ? 1 : 0);
                    });
                })

                // ajax产生错误
                if (res.code) {
                    layui.popup.failure(res.msg);
                }

            }
        });
    });

    //提交事件
    layui.use(["form", "popup"], function () {
        layui.form.on("submit(save)", function (data) {
            data.field[PRIMARY_KEY] = layui.url().search[PRIMARY_KEY];
            layui.$.ajax({
                url: UPDATE_API,
                type: "POST",
                dateType: "json",
                data: data.field,
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    return layui.popup.success(getText("操作成功"), function () {
                        parent.refreshTable();
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                    });
                }
            });
            return false;
        });
    });

</script>

</body>

</html>
