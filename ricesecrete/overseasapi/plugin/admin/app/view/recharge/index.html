                </button>
            </div>
            <div class="toggle-btn">
                <a class="layui-hide"><span data-lang="展开">展开</span><i class="layui-icon layui-icon-down"></i></a>
                <a class="layui-hide"><span data-lang="收起">收起</span><i class="layui-icon layui-icon-up"></i></a>
            </div>
        </form>
    </div>
</div>

<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script src="/app/admin/admin/js/permission.js"></script>
<script src="/app/admin/admin/js/common.js"></script>
<script>

    // 相关常量
    const PRIMARY_KEY = "id";
    const SELECT_API = "/app/admin/recharge/select";
    const UPDATE_API = "/app/admin/recharge/update";
    const DELETE_API = "/app/admin/recharge/delete";
    const INSERT_URL = "/app/admin/recharge/insert";
    const UPDATE_URL = "/app/admin/recharge/update";
    const EXPORT_URL = "/app/admin/recharge/export";
    // 支付平台id
    layui.use(["jquery", "xmSelect", "popup"], function () {
        layui.$.ajax({
            url: '/app/admin/paymentPlatform/select',
            dataType: "json",
            success: function (res) {
                if (res.code === 0) {
                    let initformattedData = res.data.map(item => {
                        return {
                            value: item.id,
                            name: '(' + item.unit + ')' + item.name
                        };
                    });
                    // 初始化 xmSelect
                    var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
                    // 语言映射
                    var langMap = {
                        'zh-CN': 'cn',
                        'zh-TW': 'cn',
                        'en': 'en'
                    };
                    var langCode = langMap[currentLang] || 'en';
                    layui.xmSelect.render({
                        language: langCode,
                        el: "#platform_id",
                        name: "platform_id",
                        initValue: [],
                        data: [], // 初始数据为空
                        model: {"icon": "hidden", "label": {"type": "text"}},
                        clickClose: true,
                        radio: true,
                        clearable: true,
                        filterable: true, // 启用过滤功能
                        toolbar: {
                            show: true,
                            list: ['ALL', 'CLEAR', 'REVERSE']
                        },
                        remoteSearch: true,
                        remoteMethod: function (val, cb, show) {
                            // 如果搜索关键词为空，不执行搜索
                            if (!val) {
                                return cb(initformattedData);
                            }
                            let name = ['like', val];
                            // 显示加载状态
                            // 执行远程搜索
                            layui.$.ajax({
                                url: '/app/admin/paymentPlatform/select',
                                data: {name},
                                dataType: "json",
                                success: function (res) {
                                    if (res.code === 0) {
                                        let formattedData = res.data.map(item => {
                                            return {
                                                value: item.id,
                                                name: '(' + item.unit + ')' + item.name
                                            };
                                        });
                                        cb(formattedData);
                                    } else {
                                        cb(initformattedData);
                                    }
                                },
                                error: function () {
                                    cb(initformattedData);
                                }
                            });
                        },
                    });
                }
            }
        });
    });
    // 字段 状态 status
    layui.use(["jquery", "xmSelect", "popup"], function () {
        layui.$.ajax({
            url: "/app/admin/dict/get/rechargestatus",
            dataType: "json",
            success: function (res) {
                let value = layui.$("#status").attr("value");
                let initValue = value ? value.split(",") : [];
                //增加全部
                res.data.unshift({
                    value: "",
                    name: getText("全部")
                })
                var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
                // 语言映射
                var langMap = {
                    'zh-CN': 'cn',
                    'zh-TW': 'cn',
                    'en': 'en'
                };
                var langCode = langMap[currentLang] || 'en';
                layui.xmSelect.render({
                    language: langCode,
                    el: "#status",
                    name: "status",
                    initValue: initValue,
                    data: res.data,
                    model: {"icon": "hidden", "label": {"type": "text"}},
                    clickClose: true,
                    radio: true,
                    clearable: true, // 允许清空
                });
                if (res.code) {
                    layui.popup.failure(res.msg);
                }
            }
        });
    });
    // 字段 创建时间 created_at
    layui.use(["laydate"], function () {
        var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
        // 语言映射
        var langMap = {
            'zh-CN': 'cn',
            'zh-TW': 'cn',
            'en': 'en'
        };
        var langCode = langMap[currentLang] || 'en';
        layui.laydate.render({
            lang: langCode,
            elem: "#created_at",
            range: ["#created_at-date-start", "#created_at-date-end"],
            type: "datetime",
        });
    })
    // 表格渲染
    layui.use(["table", "form", "common", "popup", "util"], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.$;
        let common = layui.common;
        let util = layui.util;

        // 表头参数
        let cols = [
            {
                title: getText("主键"),
                field: "id",
                width: 130,
            }, {
                title: getText("用户信息"),
                field: "user_id",
                templet: '#data-table-user-info',
                width: 260,
            }, {
                title: getText("订单信息"),
                field: "number",
                templet: '#data-table-order-info',
                width: 430,
            }, {
                title: getText("金额信息"),
                field: "money",
                templet: '#data-table-money-info',
                width: 200,
            }, {
                title: getText("订单状态"),
                field: "money",
                templet: '#data-table-status-info',
                width: 310,
            }, {
                title: getText("备注信息"),
                field: "remark",
                templet: '#data-table-remark-info',
                width: 220,
            }, {
                title: getText("创建时间"),
                field: "created_at",
                hide: true,
            }, {
                title: getText("更新时间"),
                field: "updated_at",
                hide: true,
            }, {
                title: getText("操作"),
                toolbar: "#table-bar",
                align: "center",
                fixed: "right",
                width: 130,
            }
        ];

        // 渲染表格
        function render() {
            table.render({
                elem: "#data-table",
                url: SELECT_API,
                page: {
                    layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip'],
                    groups: 5,
                    first: getText("首页"),
                    last: getText("尾页"),
                    prev: getText("上一页"),
                    next: getText("下一页"),
                    limits: [10, 20, 30, 40, 50],
                    limit: 10,
                    limitTemplet: function (curr, limit) {
                        return curr + " " + getText("条/页");
                    },
                    // limitTips: [getText("当前页"), getText("条/页"), getText("共"), getText("条")],
                    skipText: [getText("跳转"), '', getText("确认")],
                    countText: [getText("共") + " ", " " + getText("页")]
                },
                height: 'full-32',
                lineStyle: 'height: 180px;', // 定义表格的多行样式
                css: [ // 直接给当前表格主容器重置 css 样式
                    '.layui-table-page{text-align: center;}' // 让分页栏居中
                ].join(''),
                className: 'layui-table-testcss', // 用于给表格主容器追加 css 类名
                cols: [cols],
                skin: "line",
                size: "lg",
                toolbar: "#table-toolbar",
                autoSort: false,
                //无数据
                text: {
                    none: getText("暂无数据")
                },
                defaultToolbar: [{
                    title: getText("刷新"),
                    layEvent: "refresh",
                    icon: "layui-icon-refresh",
                }, "filter", "print", "exports"],
                done: function () {
                    layer.photos({photos: 'div[lay-id="data-table"]', anim: 5});
                }
            });
        }

        // 编辑或删除行事件
        table.on("tool(data-table)", function (obj) {
            if (obj.event === "remove") {
                remove(obj);
            } else if (obj.event === "edit") {
                edit(obj);
            }
        });

        // 表格顶部工具栏事件
        table.on("toolbar(data-table)", function (obj) {
            if (obj.event === "add") {
                add();
            } else if (obj.event === "refresh") {
                refreshTable();
            } else if (obj.event === "batchRemove") {
                batchRemove(obj);
            }
        });

        // 表格顶部搜索事件
        form.on("submit(table-query)", function (data) {
            table.reload("data-table", {
                page: {
                    curr: 1
                },
                where: data.field
            })
            return false;
        });

        // 表格顶部搜索重置事件
        form.on("submit(table-reset)", function (data) {
            table.reload("data-table", {
                where: []
            })
        });

        form.on("submit(table-export)", function (data) {
            // 获取form 表单数据
            // console.log(data.field)
            layer.confirm(getText("确定导出?"), {
                icon: 3,
                title: getText("提示")
            }, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: EXPORT_URL,
                    data: data.field,
                    dataType: "json",
                    type: "get",
                    success: function (res) {
                        layer.close(loading);
                        if (res.code) {
                            return layui.popup.failure(getText(res.msg));
                        }
                        return layui.popup.success(getText("操作成功"), refreshTable);
                    }
                })
            });
            return false;
        });
        // 表格排序事件
        table.on("sort(data-table)", function (obj) {
            table.reload("data-table", {
                initSort: obj,
                scrollPos: "fixed",
                where: {
                    field: obj.field,
                    order: obj.type
                }
            });
        });

        // 表格新增数据
        let add = function () {
            layer.open({
                type: 2,
                title: getText("新增"),
                shade: 0.1,
                area: [common.isModile() ? "100%" : "900px", common.isModile() ? "100%" : "550px"],
                content: INSERT_URL
            });
        }

        // 表格编辑数据
        let edit = function (obj) {
            let value = obj.data[PRIMARY_KEY];
            layer.open({
                type: 2,
                title: getText("修改"),
                shade: 0.1,
                area: [common.isModile() ? "100%" : "900px", common.isModile() ? "100%" : "550px"],
                content: UPDATE_URL + "?" + PRIMARY_KEY + "=" + value
            });
        }

        // 删除一行
        let remove = function (obj) {
            return doRemove(obj.data[PRIMARY_KEY]);
        }

        // 删除多行
        let batchRemove = function (obj) {
            let checkIds = common.checkField(obj, PRIMARY_KEY);
            if (checkIds === "") {
                layui.popup.warning(getText("未选中数据"));
                return false;
            }
            doRemove(checkIds.split(","));
        }

        // 执行删除
        let doRemove = function (ids) {
            let data = {};
            data[PRIMARY_KEY] = ids;
            layer.confirm(getText("确定删除?"), {
                icon: 3,
                title: getText("提示")
            }, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: DELETE_API,
                    data: data,
                    dataType: "json",
                    type: "post",
                    success: function (res) {
                        layer.close(loading);
                        if (res.code) {
                            return layui.popup.failure(getText(res.msg));
                        }
                        return layui.popup.success(getText("操作成功"), refreshTable);
                    }
                })
            });
        }

        // 刷新表格数据
        window.refreshTable = function () {
            table.reloadData("data-table", {
                scrollPos: "fixed",
                done: function (res, curr) {
                    if (curr > 1 && res.data && !res.data.length) {
                        curr = curr - 1;
                        table.reloadData("data-table", {
                            page: {
                                curr: curr
                            },
                        })
                    }
                }
            });
        }
        render();
    })

</script>
</body>
</html>
