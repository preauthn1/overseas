<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>新增页面</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css?v=<?=get_version() ?>"/>
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css?v=<?=get_version() ?>"/>
</head>
<body>

<form class="layui-form" action="">

    <div class="mainBox">
        <div class="main-container mr-5">

            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="用户">用户</label>
                <div class="layui-input-block">
                    <div name="user_id" id="user_id" value=""></div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="支付平台">支付平台</label>
                <div class="layui-input-block">
                    <div name="platform_id" id="platform_id" value=""></div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="金额">金额</label>
                <div class="layui-input-block">
                    <input type="text" name="original_money" value="" class="layui-input">
                </div>
            </div>
        </div>
    </div>

    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="pear-btn pear-btn-primary pear-btn-md" lay-submit=""
                    lay-filter="save">
                <span data-lang="提交">提交</span>
            </button>
            <button type="reset" class="pear-btn pear-btn-md">
                <span data-lang="重置">重置</span>
            </button>
        </div>
    </div>

</form>

<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script src="/app/admin/admin/js/permission.js"></script>
<script>

    // 相关接口
    const INSERT_API = "/app/admin/recharge/insert";

    // 用户id
    layui.use(["jquery", "xmSelect", "popup"], function () {
        layui.$.ajax({
            url: '/app/admin/user/select',
            dataType: "json",
            success: function (res) {
                if (res.code === 0) {
                    let initformattedData = res.data.map(item => {
                        return {
                            value: item.id,
                            name: (item.mobile_code ? '(' + item.mobile_code + ')' : '') + item.username
                        };
                    });
                    var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
                    // 语言映射
                    var langMap = {
                        'zh-CN': 'cn',
                        'zh-TW': 'cn',
                        'en': 'en'
                    };
                    var langCode = langMap[currentLang] || 'en';
                    // 初始化 xmSelect
                    layui.xmSelect.render({
                        el: "#user_id",
                        name: "user_id",
                        initValue: [],
                        language: langCode,
                        data: [], // 初始数据为空
                        model: {"icon": "hidden", "label": {"type": "text"}},
                        clickClose: true,
                        radio: true,
                        clearable: true,
                        filterable: true, // 启用过滤功能
                        toolbar: {
                            show: true,
                            list: ['ALL', 'CLEAR', 'REVERSE']
                        },
                        remoteSearch: true,
                        remoteMethod: function (val, cb, show) {
                            // 如果搜索关键词为空，不执行搜索
                            if (!val) {
                                return cb(initformattedData);
                            }
                            let username = ['like', val];
                            // 显示加载状态
                            // 执行远程搜索
                            layui.$.ajax({
                                url: '/app/admin/user/select',
                                data: {username},
                                dataType: "json",
                                success: function (res) {
                                    if (res.code === 0) {
                                        let formattedData = res.data.map(item => {
                                            return {
                                                value: item.id,
                                                name: (item.mobile_code ? '(' + item.mobile_code + ')' : '') + item.username
                                            };
                                        });
                                        cb(formattedData);
                                    } else {
                                        cb(initformattedData);
                                    }
                                },
                                error: function () {
                                    cb(initformattedData);
                                }
                            });
                        },
                    });
                }
            }
        });
    });
    // 支付平台id
    layui.use(["jquery", "xmSelect", "popup"], function () {
        layui.$.ajax({
            url: '/app/admin/paymentPlatform/select',
            dataType: "json",
            success: function (res) {
                if (res.code === 0) {
                    let initformattedData = res.data.map(item => {
                        return {
                            value: item.id,
                            name: '(' + item.unit + ')' + item.name
                        };
                    });
                    // 初始化 xmSelect
                    var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
                    // 语言映射
                    var langMap = {
                        'zh-CN': 'cn',
                        'zh-TW': 'cn',
                        'en': 'en'
                    };
                    var langCode = langMap[currentLang] || 'en';
                    layui.xmSelect.render({
                        language: langCode,
                        el: "#platform_id",
                        name: "platform_id",
                        initValue: [],
                        data: [], // 初始数据为空
                        model: {"icon": "hidden", "label": {"type": "text"}},
                        clickClose: true,
                        radio: true,
                        clearable: true,
                        filterable: true, // 启用过滤功能
                        toolbar: {
                            show: true,
                            list: ['ALL', 'CLEAR', 'REVERSE']
                        },
                        remoteSearch: true,
                        remoteMethod: function (val, cb, show) {
                            // 如果搜索关键词为空，不执行搜索
                            if (!val) {
                                return cb(initformattedData);
                            }
                            let name = ['like', val];
                            // 显示加载状态
                            // 执行远程搜索
                            layui.$.ajax({
                                url: '/app/admin/paymentPlatform/select',
                                data: {name},
                                dataType: "json",
                                success: function (res) {
                                    if (res.code === 0) {
                                        let formattedData = res.data.map(item => {
                                            return {
                                                value: item.id,
                                                name: '(' + item.unit + ')' + item.name
                                            };
                                        });
                                        cb(formattedData);
                                    } else {
                                        cb(initformattedData);
                                    }
                                },
                                error: function () {
                                    cb(initformattedData);
                                }
                            });
                        },
                    });
                }
            }
        });
    });

    //提交事件
    layui.use(["form", "popup"], function () {
        layui.form.on("submit(save)", function (data) {
            layui.$.ajax({
                url: INSERT_API,
                type: "POST",
                dateType: "json",
                data: data.field,
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    return layui.popup.success(getText("操作成功"), function () {
                        parent.refreshTable();
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                    });
                }
            });
            return false;
        });
    });

</script>

</body>
</html>
