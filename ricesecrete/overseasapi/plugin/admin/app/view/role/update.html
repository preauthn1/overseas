<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>更新页面</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css?v=<?=get_version() ?>"/>
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css?v=<?=get_version() ?>"/>
</head>
<body>

<form class="layui-form">

    <div class="mainBox">
        <div class="main-container mr-5">

            <div class="layui-form-item">
                <label class="layui-form-label">父级</label>
                <div class="layui-input-block">
                    <div name="pid" id="pid" value=""></div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label required">角色名</label>
                <div class="layui-input-block">
                    <input type="text" name="name" value="" required lay-verify="required" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">权限</label>
                <div class="layui-input-block">
                    <div name="rules" id="rules" value=""></div>
                </div>
            </div>

        </div>
    </div>

    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="pear-btn pear-btn-primary pear-btn-md" lay-submit="" lay-filter="save">
                提交
            </button>
            <button type="reset" class="pear-btn pear-btn-md">
                重置
            </button>
        </div>
    </div>

</form>

<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script src="/app/admin/admin/js/permission.js"></script>

<script>

    // 相关接口
    const PRIMARY_KEY = "id";
    const SELECT_API = "/app/admin/role/select" + location.search;
    const UPDATE_API = "/app/admin/role/update";

    // 获取数据库记录
    layui.use(["form", "util", "popup"], function () {
        let $ = layui.$;
        $.ajax({
            url: SELECT_API,
            dataType: "json",
            success: function (res) {

                // 给表单初始化数据
                layui.each(res.data[0], function (key, value) {
                    let obj = $('*[name="' + key + '"]');
                    if (key === "password") {
                        obj.attr("placeholder", "不更新密码请留空");
                        return;
                    }
                    if (typeof obj[0] === "undefined" || !obj[0].nodeName) return;
                    if (obj[0].nodeName.toLowerCase() === "textarea") {
                        obj.val(layui.util.escape(value));
                    } else {
                        obj.attr("value", value);
                    }
                });

                // 字段 权限 rules
                layui.use(["jquery", "xmSelect", "popup"], function () {
                    layui.$.ajax({
                        url: "/app/admin/role/rules?id=" + res.data[0].pid,
                        dataType: "json",
                        success: function (res) {
                            let value = layui.$("#rules").attr("value");
                            let initValue = value ? value.split(",") : [];
                            var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
                            // 语言映射
                            var langMap = {
                                'zh-CN': 'cn',
                                'zh-TW': 'cn',
                                'en': 'en'
                            };
                            var langCode = langMap[currentLang] || 'en';
                            layui.xmSelect.render({
                                language: langCode,
                                el: "#rules",
                                name: "rules",
                                initValue: initValue,
                                data: res.data,
                                tree: {
                                    show: true,
                                    expandedKeys: initValue,
                                },
                                height: '300px', //最大下拉框高度
                                toolbar: {show: true, list: ["ALL", "CLEAR", "REVERSE"]},
                                // on: function (data) {
                                //     let arr = data.arr;
                                //     let pid_arr = [];
                                //     arr.forEach(function (item) {
                                //         pid_arr.push(item.id);
                                //         if (item.pid) {
                                //             pid_arr.push(item.pid);
                                //         }
                                //     })
                                //     //pid_arr 去重
                                //     pid_arr = [...new Set(pid_arr)];
                                //     layui.$("#rules").attr("value", pid_arr.join(","));
                                //     console.log(data);
                                //
                                // }
                            })
                            if (res.code) {
                                layui.popup.failure(res.msg);
                            }
                        }
                    });
                });

                // 字段 父级角色组 pid
                layui.use(["jquery", "xmSelect", "popup"], function () {
                    layui.$.ajax({
                        url: "/app/admin/role/select?format=tree",
                        dataType: "json",
                        success: function (res) {
                            let value = layui.$("#pid").attr("value");
                            let initValue = value ? value.split(",") : [];
                            var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
                            // 语言映射
                            var langMap = {
                                'zh-CN': 'cn',
                                'zh-TW': 'cn',
                                'en': 'en'
                            };
                            var langCode = langMap[currentLang] || 'en';
                            layui.xmSelect.render({
                                language: langCode,
                                el: "#pid",
                                name: "pid",
                                initValue: initValue,
                                tips: "请选择",
                                toolbar: {show: true, list: ["CLEAR"]},
                                data: res.data,
                                model: {"icon": "hidden", "label": {"type": "text"}},
                                clickClose: true,
                                radio: true,
                                tree: {
                                    show: true,
                                    "strict": false,
                                    "clickCheck": true,
                                    "clickExpand": false,
                                    expandedKeys: true
                                },
                                on: function (data) {
                                    let id = data.arr[0] ? data.arr[0].value : "";
                                    if (!id) return;
                                    layui.$.ajax({
                                        url: '/app/admin/role/rules?id=' + id,
                                        dataType: 'json',
                                        success: function (res) {
                                            if (res.code) {
                                                return layui.popup.failure(getText(res.msg));
                                            }
                                            layui.xmSelect.get('#rules')[0].update({data: res.data});
                                        }
                                    });
                                }
                            });
                            if (res.code) {
                                layui.popup.failure(res.msg);
                            }
                        }
                    });
                });

                // ajax产生错误
                if (res.code) {
                    layui.popup.failure(res.msg);
                }

            }
        });
    });

    //提交事件
    layui.use(["form", "popup"], function () {
        layui.form.on("submit(save)", function (data) {
            // data.field.rules = layui.$("#rules").attr("value");
            data.field[PRIMARY_KEY] = layui.url().search[PRIMARY_KEY];
            layui.$.ajax({
                url: UPDATE_API,
                type: "POST",
                dateType: "json",
                data: data.field,
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    return layui.popup.success(getText("操作成功"), function () {
                        parent.refreshTable();
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                    });
                }
            });
            return false;
        });
    });

</script>

</body>

</html>
