<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8">
    <title>充值提现统计</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css?v=<?=get_version() ?>"/>
    <link rel="stylesheet" href="/app/admin/demos/css/console1.css"/>
    <style>
        .title-tip {
            font-size: 16px;
            position: absolute;
            left: 15px;
        }

        .title-number {
            position: absolute;
            font-size: 25px;
            top: 23px;
            left: 15px
        }

        .row-line {
            border-right: 1px solid #e2e2e2;
        }
    </style>
</head>
<body class="pear-container">
<div>
    <div class="layui-row layui-col-space10">
        <div class="layui-col-xs6 layui-col-md4">
            <div class="layui-card top-panel">
                <div class="layui-card-header" data-lang="今日数据">今日数据</div>
                <div class="layui-card-body">
                    <div class="layui-row layui-col-space5" id="today">
                        <div class="layui-col-xs6 layui-col-md6 row-line" style="color: #28333E;">
                            <span class="title-tip" data-lang="充值">充值</span>
                            <div class="title-number" id="day_recharge_value">0</div>
                        </div>
                        <div class="layui-col-xs6 layui-col-md6" style="color: #28333E;">
                            <span class="title-tip" data-lang="提现">提现</span>
                            <div class="title-number" id="day_withdraw_value">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-col-xs6 layui-col-md4">
            <div class="layui-card top-panel">
                <div class="layui-card-header">7<span data-lang="日内数据">日内数据</span></div>
                <div class="layui-card-body">
                    <div class="layui-row layui-col-space5" id="day7">
                        <div class="layui-col-xs6 layui-col-md6 row-line" style="color: #28333E;">
                            <span class="title-tip" data-lang="充值">充值</span>
                            <div class="title-number" id="day7_recharge_value">0</div>
                        </div>
                        <div class="layui-col-xs6 layui-col-md6" style="color: #28333E;">
                            <span class="title-tip" data-lang="提现">提现</span>
                            <div class="title-number" id="day7_withdraw_value">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-col-xs6 layui-col-md4">
            <div class="layui-card top-panel">
                <div class="layui-card-header">30<span data-lang="日内数据">日内数据</span></div>
                <div class="layui-card-body">
                    <div class="layui-row layui-col-space5" id="day30">
                        <div class="layui-col-xs6 layui-col-md6 row-line" style="color: #28333E;">
                            <span class="title-tip" data-lang="充值">充值</span>
                            <div class="title-number" id="day30_recharge_value">0</div>
                        </div>
                        <div class="layui-col-xs6 layui-col-md6" style="color: #28333E;">
                            <span class="title-tip" data-lang="提现">提现</span>
                            <div class="title-number" id="day30_withdraw_value">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="layui-row layui-col-space10">
        <div class="layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-body">
                    <div class="layui-tab custom-tab layui-tab-brief" lay-filter="docDemoTabBrief">
                        <div id="echarts-records" style="background-color:#ffffff;min-height:600px;padding: 10px"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!--</div>-->
<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script>
    // 相关接口
    const GETDATE_API = "/app/admin/statistics/recharge_withdraw";
    layui.use(['layer', 'echarts', 'element', 'count'], function () {
        var $ = layui.jquery,
            layer = layui.layer,
            element = layui.element,
            count = layui.count,
            echarts = layui.echarts;
        layui.$.ajax({
            url: GETDATE_API,
            type: "POST",
            dateType: "json",
            data: {},
            success: function (res) {
                if (res.code) {
                    return layui.popup.failure(getText(res.msg));
                }
                var data = res.data;
                count.up("day_recharge_value", {
                    time: 4000,
                    num: data.day.recharge,
                    bit: 0,
                    regulator: 50
                });
                count.up("day_withdraw_value", {
                    time: 4000,
                    num: data.day.withdraw,
                    bit: 0,
                    regulator: 50
                });
                count.up("day7_recharge_value", {
                    time: 4000,
                    num: data.day7.recharge,
                    bit: 0,
                    regulator: 150
                });
                count.up("day7_withdraw_value", {
                    time: 4000,
                    num: data.day7.withdraw,
                    bit: 0,
                    regulator: 150
                });
                count.up("day30_recharge_value", {
                    time: 4000,
                    num: data.day30.recharge,
                    bit: 0,
                    regulator: 500
                });
                count.up("day30_withdraw_value", {
                    time: 4000,
                    num: data.day30.withdraw,
                    bit: 0,
                    regulator: 500
                });
                var day7_list = data.day7_day;
                var day7_data_recharge = data.day7_recharge;
                var day7_data_withdraw = data.day7_withdraw;
                var echartsRecords = echarts.init(document.getElementById('echarts-records'), 'walden');

                const colorList = ["#9E87FF", '#73DDFF', '#fe9a8b', '#F56948', '#9E87FF']
                var option = {
                    backgroundColor: '#fff',
                    // 启用图例显示
                    legend: {
                        show: true,
                        top: '2%',
                        left: 'center',
                        data: [getText('充值'), getText('提现')],
                        textStyle: {
                            color: '#666',
                            fontSize: 14
                        },
                        itemWidth: 25,
                        itemHeight: 14
                    },
                    tooltip: {
                        show: false
                    },
                    grid: {
                        top: '10%',
                        bottom: '6%',
                        left: '6%',
                        right: '6%',
                        containLabel: true
                    },
                    xAxis: [{
                        type: 'category',
                        boundaryGap: false,
                        axisLine: {
                            show: false
                        },
                        axisTick: {
                            show: false
                        },
                        axisLabel: {
                            margin: 10,
                            //textStyle: {
                            fontSize: 14,
                            color: 'rgba(#999)'
                            //}
                        },
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#939ab6',
                                opacity: .15
                            }
                        },
                        data: day7_list
                    },],
                    yAxis: [{
                        type: 'value',
                        offset: 15,
                        min: 0,
                        axisTick: {
                            show: false
                        },
                        axisLine: {
                            show: false
                        },
                        axisLabel: {
                            margin: 10,
                            //textStyle: {
                            fontSize: 14,
                            color: '#999'
                            //}
                        },
                        splitLine: {
                            show: false
                        }
                    }],
                    // 在现有代码的 series 部分添加新的数据系列
                    series: [{
                        name: getText('充值'),
                        type: 'line',
                        z: 3,
                        showSymbol: false,
                        smoothMonotone: 'x',
                        lineStyle: {
                            width: 3,
                            color: {
                                type: 'linear',
                                x: 0,
                                y: 0,
                                x2: 0,
                                y2: 1,
                                colorStops: [{
                                    offset: 0,
                                    color: 'rgba(59,102,246)' // 0% 处的颜色
                                }, {
                                    offset: 1,
                                    color: 'rgba(118,237,252)' // 100% 处的颜色
                                }]
                            },
                            shadowBlur: 4,
                            shadowColor: 'rgba(69,126,247,.2)',
                            shadowOffsetY: 4
                        },
                        areaStyle: {
                            color: {
                                type: 'linear',
                                x: 0,
                                y: 0,
                                x2: 0,
                                y2: 1,
                                colorStops: [{
                                    offset: 0,
                                    color: 'rgba(227,233,250,.9)' // 0% 处的颜色
                                }, {
                                    offset: 1,
                                    color: 'rgba(248,251,252,.3)' // 100% 处的颜色
                                }]
                            }
                        },
                        smooth: true,
                        data: day7_data_recharge
                    }, {
                        name: getText('提现'),
                        type: 'line',
                        z: 3,
                        showSymbol: false,
                        smoothMonotone: 'x',
                        lineStyle: {
                            width: 3,
                            color: {
                                type: 'linear',
                                x: 0,
                                y: 0,
                                x2: 0,
                                y2: 1,
                                colorStops: [{
                                    offset: 0,
                                    color: 'rgba(255, 105, 180, 1)' // 粉红色，区别于充值的蓝色
                                }, {
                                    offset: 1,
                                    color: 'rgba(255, 182, 193, 1)' // 浅粉红色
                                }]
                            },
                            shadowBlur: 4,
                            shadowColor: 'rgba(255, 105, 180, .2)',
                            shadowOffsetY: 4
                        },
                        areaStyle: {
                            color: {
                                type: 'linear',
                                x: 0,
                                y: 0,
                                x2: 0,
                                y2: 1,
                                colorStops: [{
                                    offset: 0,
                                    color: 'rgba(255, 182, 193, .5)' // 0% 处的颜色
                                }, {
                                    offset: 1,
                                    color: 'rgba(255, 255, 255, .1)' // 100% 处的颜色
                                }]
                            }
                        },
                        smooth: true,
                        data: day7_data_withdraw
                    }]
                };
                echartsRecords.setOption(option);

                window.onresize = function () {
                    echartsRecords.resize();
                }
            }
        });
    });
</script>
</body>
</html>
