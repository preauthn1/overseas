<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>新增页面</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css?v=<?=get_version() ?>" />
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css?v=<?=get_version() ?>" />
</head>
<body>

<form class="layui-form" action="">

    <div class="mainBox">
        <div class="main-container mr-5">

            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="类别">类别</label>
                <div class="layui-input-block">
                    <div name="category" id="category" value="" ></div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="文件">文件</label>
                <div class="layui-input-block">
                    <span></span>
                    <input type="text" style="display:none" name="url" value="" />
                    <button type="button" class="pear-btn pear-btn-primary pear-btn-sm" id="url">
                        <i class="layui-icon layui-icon-upload"></i><span data-lang="上传文件">上传文件</span>
                    </button>
                </div>
            </div>

        </div>
    </div>

</form>

<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script src="/app/admin/admin/js/permission.js"></script>
<script>

    // 字段 文件 url
    layui.use(["upload", "layer", "popup", "util"], function() {
        let input = layui.$("#url").prev();
        input.prev().html(layui.util.escape(input.val()));
        layui.upload.render({
            elem: "#url",
            accept: "file",
            data: {category: function () {
                    return layui.$('input[name="category"]').val();
                }},
            url: "/app/admin/upload/insert",
            field: "__file__",
            done: function (res) {
                if (res.code) return layui.popup.failure(getText(res.msg));
                parent.refreshTable();
                parent.layer.close(parent.layer.getFrameIndex(window.name));
            }
        });
    });

    // 字段 类别 category
    layui.use(["jquery", "xmSelect"], function() {
        layui.$.ajax({
            url: "/app/admin/dict/get/upload",
            dataType: "json",
            success: function (res) {
                let value = layui.$("#category").attr("value");
                let initValue = value ? value.split(",") : [];
                var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
                // 语言映射
                var langMap = {
                    'zh-CN': 'cn',
                    'zh-TW': 'cn',
                    'en': 'en'
                };
                var langCode = langMap[currentLang] || 'en';
                layui.xmSelect.render({
                    language: langCode,
                    el: "#category",
                    name: "category",
                    initValue: initValue,
                    data: res.data,
                    model: {"icon":"hidden","label":{"type":"text"}},
                    clickClose: true,
                    radio: true,
                });
                if (res.code) {
                    return layui.popup.failure(getText(res.msg));
                }
            }
        });
    });

</script>

</body>
</html>
