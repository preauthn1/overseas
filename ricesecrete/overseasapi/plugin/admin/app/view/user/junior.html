<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="utf-8">
    <title>浏览页面</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css?v=<?=get_version() ?>"/>
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css?v=<?=get_version() ?>"/>
    <style>
        /* 自定义样式  */
        .layui-table-cell {
            line-height: 30px !important;
        }
    </style>
</head>
<body class="pear-container">
<!-- 数据表格 -->
<div class="layui-card">
    <div class="layui-card-body">
        <table id="data-table" lay-filter="data-table"></table>
    </div>
</div>
<!--用户信息-->
<script type="text/html" id="data-table-user-info">
    <ul>
        <li>{{= getText('ID') }}:{{= d.id }}</li>
        {{# if (d.login_type == 1) {}}
        <li>{{= getText('账号') }}: ({{=d.mobile_code}}){{= d.username }}</li>
        {{# } else { }}
        <li>{{= getText('账号') }}: {{= d.username }}</li>
        {{# } }}
        <li>{{= getText('等级') }}: {{= d.level }}</li>
        <li>{{= getText('语言') }}: {{= d.lang }}</li>
        {{# if (d.is_demo == 1) { }}
        <li><span style="color: red">{{= getText('虚拟账户') }}</span></li>
        {{# } }}
    </ul>
</script>


<!--充提/钱包-->
<script type="text/html" id="data-table-user-money">
    <ul>
        <li>{{= getText('基础钱包') }}: {{= d.user_money }}</li>
        <!--        <li>{{= getText('体验钱包') }}: {{= d.bonus_money }}</li>-->
        <!--        <li>{{= getText('充值钱包') }}: {{= d.recharge_money }}</li>-->
        <!--        <li>{{= getText('佣金钱包') }}: {{= d.brokerage_money }}</li>-->
    </ul>
</script>
<!--状态设置-->
<script type="text/html" id="data-table-user-status">
    <ul>
        <!-- 用户状态 -->
        <li>
            {{= getText('用户状态') }}:
            <input type="checkbox" disabled name="status" value="{{= d.id}}" lay-skin="switch"
                   lay-filter="statusSwitch" {{=d.status==1?'checked':'' }} lay-text="启用|禁用" data-lang="启用|禁用">
        </li>
        <!-- 提现状态 -->
        <li>
            {{= getText('提现状态') }}:
            <input type="checkbox" disabled name="withdraw_status" value="{{= d.id}}" lay-skin="switch"
                   lay-filter="withdrawStatusSwitch" {{=d.withdraw_status==1?'checked':'' }} lay-text="启用|禁用" data-lang="启用|禁用">
        </li>
    </ul>
</script>
<!--注册登录-->
<script type="text/html" id="data-table-user-time">
    <ul>
        <li>{{= getText('注册时间') }}:{{= d.join_time }}</li>
        <li>{{= getText('注册IP') }}: {{= d.join_ip }}</li>
        <li>{{= getText('登录时间') }}:{{= d.last_time }}</li>
        <li>{{= getText('登录IP') }}:{{= d.last_ip }}</li>
    </ul>
</script>

<!-- 表格行工具栏 -->
<script type="text/html" id="table-bar">
    <button class="pear-btn pear-btn-xs tool-btn" lay-event="edit" permission="app.admin.user.update">{{= getText('编辑') }}</button>
    <button class="pear-btn pear-btn-xs tool-btn" lay-event="userbill" permission="app.admin.userbill.insert">{{= getText('改钱') }}
    </button>
    <!--    <button class="pear-btn pear-btn-xs tool-btn" lay-event="remove" permission="app.admin.user.delete">{{= getText('删除') }}</button>-->
</script>

<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script src="/app/admin/admin/js/permission.js"></script>
<script src="/app/admin/admin/js/common.js"></script>
<script>

    // 相关常量
    const PRIMARY_KEY = "id";
    const SELECT_API = "/app/admin/user/select";
    const UPDATE_API = "/app/admin/user/update";
    const DELETE_API = "/app/admin/user/delete";
    const INSERT_URL = "/app/admin/user/insert";
    const UPDATE_URL = "/app/admin/user/update";
    const USERBILL_URL = "/app/admin/userbill/insert";

    // 字段 性别 sex
    layui.use(["jquery", "xmSelect", "popup"], function () {
        layui.$.ajax({
            url: "/app/admin/dict/get/sex",
            dataType: "json",
            success: function (res) {
                let value = layui.$("#sex").attr("value");
                let initValue = value ? value.split(",") : [];
                //增加全部
                res.data.unshift({
                    value: "",
                    name: getText("全部")
                })
                var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
                // 语言映射
                var langMap = {
                    'zh-CN': 'cn',
                    'zh-TW': 'cn',
                    'en': 'en'
                };
                var langCode = langMap[currentLang] || 'en';
                layui.xmSelect.render({
                    language: langCode,
                    el: "#sex",
                    name: "sex",
                    initValue: initValue,
                    data: res.data,
                    model: {"icon": "hidden", "label": {"type": "text"}},
                    clickClose: true,
                    radio: true,
                });
                if (res.code) {
                    layui.popup.failure(res.msg);
                }
            }
        });
    });

    // 字段 生日 birthday
    layui.use(["laydate"], function () {
        var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
        // 语言映射
        var langMap = {
            'zh-CN': 'cn',
            'zh-TW': 'cn',
            'en': 'en'
        };
        var langCode = langMap[currentLang] || 'en';
        layui.laydate.render({
            lang: langCode,
            elem: "#birthday",
            range: ["#birthday-date-start", "#birthday-date-end"],
        });
    })

    // 字段 登录时间 last_time
    layui.use(["laydate"], function () {
        var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
        // 语言映射
        var langMap = {
            'zh-CN': 'cn',
            'zh-TW': 'cn',
            'en': 'en'
        };
        var langCode = langMap[currentLang] || 'en';
        layui.laydate.render({
            lang: langCode,
            elem: "#last_time",
            range: ["#last_time-date-start", "#last_time-date-end"],
            type: "datetime",
        });
    })

    // 字段 注册时间 join_time
    layui.use(["laydate"], function () {
        var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
        // 语言映射
        var langMap = {
            'zh-CN': 'cn',
            'zh-TW': 'cn',
            'en': 'en'
        };
        var langCode = langMap[currentLang] || 'en';
        layui.laydate.render({
            lang: langCode,
            elem: "#join_time",
            range: ["#join_time-date-start", "#join_time-date-end"],
            type: "datetime",
        });
    })

    // 表格渲染
    layui.use(["table", "form", "common", "popup", "util"], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.$;
        let common = layui.common;
        let util = layui.util;

        // 表头参数
        let cols = [
            {
                type: "checkbox"
            }, {
                title: getText("用户信息"),
                field: "username",
                templet: '#data-table-user-info'
            }, {
                title: getText("充提/钱包"),
                field: "money",
                templet: '#data-table-user-money'
            }, {
                title: getText("注册/登录"),
                field: "last_time",
                templet: '#data-table-user-time'
            }, {
                title: getText("更新时间"),
                field: "updated_at",
                hide: true,
            }, {
                title: getText("状态设置"),
                field: "status",
                templet: '#data-table-user-status'
            },
            // , {
            //     title: getText("操作"),
            //     toolbar: "#table-bar",
            //     align: "center",
            //     fixed: "right",
            //     width: 130,
            // }
        ];

        // 渲染表格
        function render() {
            table.render({
                elem: "#data-table",
                url: SELECT_API,
                page: {
                    layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip'],
                    groups: 5,
                    first: getText("首页"),
                    last: getText("尾页"),
                    prev: getText("上一页"),
                    next: getText("下一页"),
                    limits: [10, 20, 30, 40, 50],
                    limit: 10,
                    limitTemplet: function (curr, limit) {
                        return curr + " " + getText("条/页");
                    },
                    // limitTips: [getText("当前页"), getText("条/页"), getText("共"), getText("条")],
                    skipText: [getText("跳转"), '', getText("确认")],
                    countText: [getText("共") + " ", " " + getText("页")]
                },
                height: 'full-35',
                lineStyle: 'height: 166px;', // 定义表格的多行样式
                css: [ // 直接给当前表格主容器重置 css 样式
                    '.layui-table-page{text-align: center;}' // 让分页栏居中
                ].join(''),
                className: 'layui-table-testcss', // 用于给表格主容器追加 css 类名
                cols: [cols],
                skin: "line",
                size: "lg",
                where: {
                    'top_id': "<?=$top_id?>",
                },
                // toolbar: "#table-toolbar",
                autoSort: false,
                text: {
                    none: getText("暂无数据")
                },
                defaultToolbar: [{
                    title: getText("刷新"),
                    layEvent: "refresh",
                    icon: "layui-icon-refresh",
                }, "filter", "print", "exports"],
                done: function () {
                    layer.photos({photos: 'div[lay-id="data-table"]', anim: 5});
                }
            });
        }

        // 更新字段的通用函数
        function updateField(id, data, field) {
            let load = layer.load();
            let postData = {};
            postData[field] = data.elem.checked ? 1 : 0;
            postData[PRIMARY_KEY] = id;
            $.post(UPDATE_API, postData, function (res) {
                layer.close(load);
                if (res.code) {
                    return layui.popup.failure(getText(res.msg), function () {
                        data.elem.checked = !data.elem.checked;
                        form.render();
                    });
                }
                return layui.popup.success(getText("操作成功"));
            })
        }

        // 获取表格中下拉或树形组件数据
        let apis = [];
        apis.push(["sex", "/app/admin/dict/get/sex"]);
        let apiResults = {};
        apiResults["sex"] = [];
        let count = apis.length;
        layui.each(apis, function (k, item) {
            let [field, url] = item;
            $.ajax({
                url: url,
                dateType: "json",
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }

                    function travel(items) {
                        for (let k in items) {
                            let item = items[k];
                            apiResults[field][item.value] = item.name;
                            if (item.children) {
                                travel(item.children);
                            }
                        }
                    }

                    travel(res.data);
                },
                complete: function () {
                    if (--count === 0) {
                        render();
                    }
                }
            });
        });
        if (!count) {
            render();
        }

        // 编辑或删除行事件
        table.on("tool(data-table)", function (obj) {
            if (obj.event === "remove") {
                remove(obj);
            } else if (obj.event === "edit") {
                edit(obj);
            } else if (obj.event === "userbill") {
                userbill(obj);
            }
        });

        // 表格顶部工具栏事件
        table.on("toolbar(data-table)", function (obj) {
            if (obj.event === "add") {
                add();
            } else if (obj.event === "refresh") {
                refreshTable();
            } else if (obj.event === "batchRemove") {
                batchRemove(obj);
            }
        });
        // 用户状态 Switch 事件
        form.on('switch(statusSwitch)', function (data) {
            updateField(this.value, data, 'status');
        }); // 用户状态 Switch 事件
        form.on('switch(withdrawStatusSwitch)', function (data) {
            updateField(this.value, data, 'withdraw_status');
        });
        // 表格顶部搜索事件
        form.on("submit(table-query)", function (data) {
            table.reload("data-table", {
                page: {
                    curr: 1
                },
                where: data.field
            })
            return false;
        });

        // 表格顶部搜索重置事件
        form.on("submit(table-reset)", function (data) {
            table.reload("data-table", {
                where: []
            })
        });

        // 表格排序事件
        table.on("sort(data-table)", function (obj) {
            table.reload("data-table", {
                initSort: obj,
                scrollPos: "fixed",
                where: {
                    field: obj.field,
                    order: obj.type
                }
            });
        });

        // 表格新增数据
        let add = function () {
            layer.open({
                type: 2,
                title: getText("新增"),
                shade: 0.1,
                area: [common.isModile() ? "100%" : "800px", common.isModile() ? "100%" : "450px"],
                content: INSERT_URL
            });
        }
        // 修改用户钱包金额
        let userbill = function (obj) {
            layer.open({
                type: 2,
                title: getText("修改"),
                shade: 0.1,
                area: [common.isModile() ? "100%" : "800px", common.isModile() ? "100%" : "450px"],
                content: USERBILL_URL + "?user_id=" + obj.data[PRIMARY_KEY]
            });
        }

        // 表格编辑数据
        let edit = function (obj) {
            let value = obj.data[PRIMARY_KEY];
            layer.open({
                type: 2,
                title: getText("修改"),
                shade: 0.1,
                area: [common.isModile() ? "100%" : "800px", common.isModile() ? "100%" : "450px"],
                content: UPDATE_URL + "?" + PRIMARY_KEY + "=" + value
            });
        }

        // 删除一行
        let remove = function (obj) {
            return doRemove(obj.data[PRIMARY_KEY]);
        }

        // 删除多行
        let batchRemove = function (obj) {
            let checkIds = common.checkField(obj, PRIMARY_KEY);
            if (checkIds === "") {
                layui.popup.warning(getText("未选中数据"));
                return false;
            }
            doRemove(checkIds.split(","));
        }

        // 执行删除
        let doRemove = function (ids) {
            let data = {};
            data[PRIMARY_KEY] = ids;
            layer.confirm(getText("确定删除?"), {
                icon: 3,
                title: getText("提示")
            }, function (index) {
                layer.close(index);
                let loading = layer.load();
                $.ajax({
                    url: DELETE_API,
                    data: data,
                    dataType: "json",
                    type: "post",
                    success: function (res) {
                        layer.close(loading);
                        if (res.code) {
                            return layui.popup.failure(getText(res.msg));
                        }
                        return layui.popup.success(getText("操作成功"), refreshTable);
                    }
                })
            });
        }

        // 刷新表格数据
        window.refreshTable = function () {
            table.reloadData("data-table", {
                scrollPos: "fixed",
                done: function (res, curr) {
                    if (curr > 1 && res.data && !res.data.length) {
                        curr = curr - 1;
                        table.reloadData("data-table", {
                            page: {
                                curr: curr
                            },
                        })
                    }
                }
            });
        }
    })

</script>
</body>
</html>
