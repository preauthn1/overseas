<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script src="/app/admin/admin/js/permission.js"></script>
<script>

    // 相关接口
    const PRIMARY_KEY = "id";
    const SELECT_API = "/app/admin/user/select" + location.search;
    const UPDATE_API = "/app/admin/user/update";

    // 获取数据库记录
    layui.use(["form", "util", "popup"], function () {
        let $ = layui.$;
        $.ajax({
            url: SELECT_API,
            dataType: "json",
            success: function (res) {

                // 给表单初始化数据
                layui.each(res.data[0], function (key, value) {
                    let obj = $('*[name="' + key + '"]');
                    if (key === "password" || key === "security_code") {
                        obj.attr("placeholder", getText("不更新密码请留空"));
                        return;
                    }
                    if (typeof obj[0] === "undefined" || !obj[0].nodeName) return;
                    if (obj[0].nodeName.toLowerCase() === "textarea") {
                        obj.val(layui.util.escape(value));
                    } else if (obj[0].nodeName.toLowerCase() === "input" && obj.attr("type") === "radio") {
                        // 处理radio选中
                        obj.each(function () {
                            if ($(this).val() == value) {
                                $(this).prop("checked", true);
                            }
                        });
                        // 重新渲染表单以显示选中状态
                        layui.form.render('radio');
                    } else {
                        obj.attr("value", value);
                    }
                });
                //会员等级下拉列表
                // layui.use(["jquery", "xmSelect"], function () {
                //     let value = layui.$("#level").attr("value");
                //     let initValue = value ? value.split(",") : [];
                //     layui.$.ajax({
                //         url: "/app/admin/userLevel/select",
                //         dataType: "json",
                //         success: function (res) {
                //             let data = res.data;
                //             let options = [];
                //             data.forEach(function (item) {
                //                 options.push({
                //                     name: item.name,
                //                     value: item.number
                //                 });
                //             });
                //             var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
                //             // 语言映射
                //             var langMap = {
                //                 'zh-CN': 'cn',
                //                 'zh-TW': 'cn',
                //                 'en': 'en'
                //             };
                //             var langCode = langMap[currentLang] || 'en';
                //             layui.xmSelect.render({
                //                 language: langCode,
                //                 el: "#level",
                //                 name: "level",
                //                 initValue: initValue,
                //                 data: options,
                //                 value: "0",
                //                 model: {"icon": "hidden", "label": {"type": "text"}},
                //                 clickClose: true,
                //                 radio: true,
                //             })
                //         }
                //     });
                // });

                // 字段 头像 avatar
                layui.use(["upload", "layer"], function () {
                    let input = layui.$("#avatar").prev();
                    input.prev().attr("src", input.val());
                    layui.$("#attachment-choose-avatar").on("click", function () {
                        parent.layer.open({
                            type: 2,
                            title: getText("选择附件"),
                            content: "/app/admin/upload/attachment?ext=jpg,jpeg,png,gif,bmp",
                            area: ["95%", "90%"],
                            success: function (layero, index) {
                                parent.layui.$("#layui-layer" + index).data("callback", function (data) {
                                    input.val(data.url).prev().attr("src", data.url);
                                });
                            }
                        });
                    });
                    layui.upload.render({
                        elem: "#avatar",
                        url: "/app/admin/upload/avatar",
                        acceptMime: "image/gif,image/jpeg,image/jpg,image/png",
                        field: "__file__",
                        done: function (res) {
                            if (res.code > 0) return layui.layer.msg(res.msg);
                            this.item.prev().val(res.data.url).prev().attr("src", res.data.url);
                        }
                    });
                });

                // 字段 生日 birthday
                layui.use(["laydate"], function () {
                    var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
                    // 语言映射
                    var langMap = {
                        'zh-CN': 'cn',
                        'zh-TW': 'cn',
                        'en': 'en'
                    };
                    var langCode = langMap[currentLang] || 'en';
                    layui.laydate.render({
                        lang: langCode,
                        elem: "#birthday",
                    });
                })

                // 字段 登录时间 last_time
                layui.use(["laydate"], function () {
                    var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
                    // 语言映射
                    var langMap = {
                        'zh-CN': 'cn',
                        'zh-TW': 'cn',
                        'en': 'en'
                    };
                    var langCode = langMap[currentLang] || 'en';
                    layui.laydate.render({
                        lang: langCode,
                        elem: "#last_time",
                        type: "datetime",
                    });
                })

                // 字段 注册时间 join_time
                layui.use(["laydate"], function () {
                    var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
                    // 语言映射
                    var langMap = {
                        'zh-CN': 'cn',
                        'zh-TW': 'cn',
                        'en': 'en'
                    };
                    var langCode = langMap[currentLang] || 'en';
                    layui.laydate.render({
                        lang: langCode,
                        elem: "#join_time",
                        type: "datetime",
                    });
                })

                // 字段 禁用 status
                layui.use(["form"], function () {
                    layui.$("#status").attr("checked", layui.$('input[name="status"]').val() != 0);
                    layui.form.render();
                    layui.form.on("switch(status)", function (data) {
                        layui.$('input[name="status"]').val(this.checked ? 1 : 0);
                    });
                    layui.$("#withdraw_status").attr("checked", layui.$('input[name="withdraw_status"]').val() != 0);
                    layui.form.render();
                    layui.form.on("switch(withdraw_status)", function (data) {
                        layui.$('input[name="withdraw_status"]').val(this.checked ? 1 : 0);
                    });

                    layui.form.on("radio(login_type)", function (data) {
                        if (data.value == "1") { // 手机号
                            layui.$("#mobile_item").show();
                            layui.$("#email_item").hide();
                        } else { // 邮箱
                            layui.$("#mobile_item").hide();
                            layui.$("#email_item").show();
                        }
                    });

                    // 初始化时根据默认选中项显示对应表单
                    if (layui.$('input[name="login_type"]:checked').val() == "1") {
                        layui.$("#mobile_item").show();
                        layui.$("#email_item").hide();
                    } else {
                        layui.$("#mobile_item").hide();
                        layui.$("#email_item").show();
                    }
                })

                // ajax产生错误
                if (res.code) {
                    layui.popup.failure(res.msg);
                }

            }
        });
    });

    //提交事件
    layui.use(["form", "popup"], function () {
        layui.form.on("submit(save)", function (data) {
            data.field[PRIMARY_KEY] = layui.url().search[PRIMARY_KEY];
            layui.$.ajax({
                url: UPDATE_API,
                type: "POST",
                dateType: "json",
                data: data.field,
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    return layui.popup.success(getText("操作成功"), function () {
                        parent.refreshTable();
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                    });
                }
            });
            return false;
        });
    });

</script>

</body>
