<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>新增页面</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css?v=<?=get_version() ?>"/>
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css?v=<?=get_version() ?>"/>
</head>
<body>

<form class="layui-form" action="">

    <div class="mainBox">
        <div class="main-container mr-5">
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="用户">用户</label>
                <div class="layui-input-block">
                    <div name="user_id" id="user_id" value="<?=$user_id ?>"></div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="钱包">钱包</label>
                <div class="layui-input-block">
                    <div name="type" id="type" value=""></div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="账变类型">账变类型</label>
                <div class="layui-input-block">
                    <div name="detail_type" id="detail_type" value=""></div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="变动类型">变动类型</label>
                <div class="layui-input-block">
                    <input type="radio" name="change" value="1" title="增加" data-lang="增加" checked>
                    <input type="radio" name="change" value="2" title="减少" data-lang="减少">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="变动金额">变动金额</label>
                <div class="layui-input-block">
                    <input type="text" name="money" value="" required lay-verify="required" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="备注">备注</label>
                <div class="layui-input-block">
                    <input type="text" name="remark" value="" class="layui-input">
                </div>
            </div>
        </div>
    </div>

    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="pear-btn pear-btn-primary pear-btn-md" lay-submit=""
                    lay-filter="save">
                <span data-lang="提交">提交</span>
            </button>
            <button type="reset" class="pear-btn pear-btn-md">
                <span data-lang="重置">重置</span>
            </button>
        </div>
    </div>

</form>

<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script src="/app/admin/admin/js/permission.js"></script>
<script>

    // 相关接口
    const INSERT_API = "/app/admin/userbill/insert";

    // 用户id
    layui.use(["jquery", "xmSelect", "popup"], function () {
        let user_id = layui.$("#user_id").attr('value');
        console.log(user_id)
        layui.$.ajax({
            url: '/app/admin/user/select',
            dataType: "json",
            success: function (res) {
                if (res.code === 0) {
                    let initformattedData = res.data.map(item => {
                        return {
                            value: item.id,
                            name: (item.mobile_code ? '(' + item.mobile_code + ')' : '') + item.username
                        };
                    });
                    // 初始化 xmSelect
                    var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
                    // 语言映射
                    var langMap = {
                        'zh-CN': 'cn',
                        'zh-TW': 'cn',
                        'en': 'en'
                    };
                    var langCode = langMap[currentLang] || 'en';
                    layui.xmSelect.render({
                        language: langCode,
                        el: "#user_id",
                        name: "user_id",
                        initValue: user_id ? [parseInt(user_id)] : [],
                        data: initformattedData, // 初始数据为空
                        model: {"icon": "hidden", "label": {"type": "text"}},
                        clickClose: true,
                        radio: true,
                        clearable: true,
                        filterable: true, // 启用过滤功能
                        toolbar: {
                            show: true,
                            list: ['ALL', 'CLEAR', 'REVERSE']
                        },
                        remoteSearch: true,
                        remoteMethod: function (val, cb, show) {
                            // 如果搜索关键词为空，不执行搜索
                            if (!val) {
                                return cb(initformattedData);
                            }
                            let username = ['like', val];
                            // 显示加载状态
                            // 执行远程搜索
                            layui.$.ajax({
                                url: '/app/admin/user/select',
                                data: {username},
                                dataType: "json",
                                success: function (res) {
                                    if (res.code === 0) {
                                        let formattedData = res.data.map(item => {
                                            return {
                                                value: item.id,
                                                name: (item.mobile_code ? '(' + item.mobile_code + ')' : '') + item.username
                                            };
                                        });
                                        cb(formattedData);
                                    } else {
                                        cb(initformattedData);
                                    }
                                },
                                error: function () {
                                    cb(initformattedData);
                                }
                            });
                        },
                    });
                }
            }
        });
    });

    // 字段 钱类型 type
    layui.use(["jquery", "xmSelect", "popup"], function () {
        layui.$.ajax({
            url: "/app/admin/dict/get/billtype",
            dataType: "json",
            success: function (res) {
                let value = layui.$("#type").attr("value");
                let initValue = value ? value.split(",") : [];
                res.data.forEach(function (item) {
                    item.name = getText(item.name);
                })
                var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
                // 语言映射
                var langMap = {
                    'zh-CN': 'cn',
                    'zh-TW': 'cn',
                    'en': 'en'
                };
                var langCode = langMap[currentLang] || 'en';
                layui.xmSelect.render({
                    language: langCode,
                    el: "#type",
                    name: "type",
                    initValue: initValue,
                    data: res.data,
                    model: {"icon": "hidden", "label": {"type": "text"}},
                    clickClose: true,
                    radio: true,
                });
                if (res.code) {
                    layui.popup.failure(res.msg);
                }
            }
        });
    });
    // 字段 明细类型 detail_type
    layui.use(["jquery", "xmSelect", "popup"], function () {
        layui.$.ajax({
            url: "/app/admin/dict/get/detailtype",
            dataType: "json",
            success: function (res) {
                let value = layui.$("#detail_type").attr("value");
                let initValue = value ? value.split(",") : [];
                res.data.forEach(function (item) {
                    item.name = getText(item.name);
                })
                var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
                // 语言映射
                var langMap = {
                    'zh-CN': 'cn',
                    'zh-TW': 'cn',
                    'en': 'en'
                };
                var langCode = langMap[currentLang] || 'en';
                layui.xmSelect.render({
                    language: langCode,
                    el: "#detail_type",
                    name: "detail_type",
                    initValue: initValue,
                    data: res.data,
                    model: {"icon": "hidden", "label": {"type": "text"}},
                    clickClose: true,
                    radio: true,
                });
                if (res.code) {
                    layui.popup.failure(res.msg);
                }
            }
        });
    });
    // 字段 禁用 status
    layui.use(["form"], function () {
        layui.$("#status").attr("checked", layui.$('input[name="status"]').val() != 0);
        layui.form.render();
        layui.form.on("switch(status)", function (data) {
            layui.$('input[name="status"]').val(this.checked ? 1 : 0);
        });
    })

    //提交事件
    layui.use(["form", "popup"], function () {
        layui.form.on("submit(save)", function (data) {
            layui.$.ajax({
                url: INSERT_API,
                type: "POST",
                dateType: "json",
                data: data.field,
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    return layui.popup.success(getText("操作成功"), function () {
                        parent.refreshTable();
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                    });
                }
            });
            return false;
        });
    });

</script>

</body>
</html>
