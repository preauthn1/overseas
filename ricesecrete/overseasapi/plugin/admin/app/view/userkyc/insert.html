<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>新增页面</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css?v=<?=get_version() ?>"/>
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css?v=<?=get_version() ?>"/>
</head>
<body>

<form class="layui-form" action="">

    <div class="mainBox">
        <div class="main-container mr-5">

            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="用户">用户</label>
                <div class="layui-input-block">
                    <div name="user_id" id="user_id" value=""></div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="姓">姓</label>
                <div class="layui-input-block">
                    <input type="text" name="surname" value="" required lay-verify="required" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="名">名</label>
                <div class="layui-input-block">
                    <input type="text" name="name" value="" required lay-verify="required" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="证件号">证件号</label>
                <div class="layui-input-block">
                    <input type="text" name="id_number" value="" required lay-verify="required" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="证件照正面">证件照正面</label>
                <div class="layui-input-block">
                    <input type="text" style="display:none" name="front" value=""/>
                    <button type="button" class="pear-btn pear-btn-primary pear-btn-sm" id="front">
                        <i class="layui-icon layui-icon-upload"></i><span data-lang="上传文件">上传文件</span>
                    </button>
                    <button type="button" class="pear-btn pear-btn-danger pear-btn-sm" id="deleteFront"
                            style="display:none;margin-left: 10px;">
                        <i class="layui-icon layui-icon-delete"></i><span data-lang="删除图片">删除图片</span>
                    </button>
                    <div id="frontPreview" style="margin-top: 10px;display:none;">
                        <img src="" style="max-width: 200px;max-height: 200px;border: 1px solid #eee;padding: 5px;">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="证件照背面">证件照背面</label>
                <div class="layui-input-block">
                    <input type="text" style="display:none" name="back" value=""/>
                    <button type="button" class="pear-btn pear-btn-primary pear-btn-sm" id="back">
                        <i class="layui-icon layui-icon-upload"></i><span data-lang="上传文件">上传文件</span>
                    </button>
                    <button type="button" class="pear-btn pear-btn-danger pear-btn-sm" id="deleteBack"
                            style="display:none;margin-left: 10px;">
                        <i class="layui-icon layui-icon-delete"></i><span data-lang="删除图片">删除图片</span>
                    </button>
                    <div id="backPreview" style="margin-top: 10px;display:none;">
                        <img src="" style="max-width: 200px;max-height: 200px;border: 1px solid #eee;padding: 5px;">
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="手持证件照">手持证件照</label>
                <div class="layui-input-block">
                    <input type="text" style="display:none" name="handheld" value=""/>
                    <button type="button" class="pear-btn pear-btn-primary pear-btn-sm" id="handheld">
                        <i class="layui-icon layui-icon-upload"></i><span data-lang="上传文件">上传文件</span>
                    </button>
                    <button type="button" class="pear-btn pear-btn-danger pear-btn-sm" id="deleteHandheld"
                            style="display:none;margin-left: 10px;">
                        <i class="layui-icon layui-icon-delete"></i><span data-lang="删除图片">删除图片</span>
                    </button>
                    <div id="handheldPreview" style="margin-top: 10px;display:none;">
                        <img src="" style="max-width: 200px;max-height: 200px;border: 1px solid #eee;padding: 5px;">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="状态">状态</label>
                <div class="layui-input-block">
                    <input type="radio" name="status" value="1" title="审核中" data-lang="审核中" checked/>
                    <input type="radio" name="status" value="2" title="已认证" data-lang="已认证"/>
                    <input type="radio" name="status" value="3" title="认证失败" data-lang="认证失败"/>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="pear-btn pear-btn-primary pear-btn-md" lay-submit=""
                    lay-filter="save">
                <span data-lang="提交">提交</span>
            </button>
            <button type="reset" class="pear-btn pear-btn-md">
                <span data-lang="重置">重置</span>
            </button>
        </div>
    </div>

</form>

<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script src="/app/admin/admin/js/permission.js"></script>
<script>

    // 相关接口
    const INSERT_API = "/app/admin/userkyc/insert";

    // 用户id
    layui.use(["jquery", "xmSelect", "popup"], function () {
        layui.$.ajax({
            url: '/app/admin/user/select',
            dataType: "json",
            success: function (res) {
                if (res.code === 0) {
                    let initformattedData = res.data.map(item => {
                        return {
                            value: item.id,
                            name: (item.mobile_code ? '(' + item.mobile_code + ')' : '') + item.username
                        };
                    });
                    // 初始化 xmSelect
                    var currentLang = localStorage.getItem('admin_language') || 'zh-CN';
                    // 语言映射
                    var langMap = {
                        'zh-CN': 'cn',
                        'zh-TW': 'cn',
                        'en': 'en'
                    };
                    var langCode = langMap[currentLang] || 'en';
                    layui.xmSelect.render({
                        language: langCode,
                        el: "#user_id",
                        name: "user_id",
                        initValue: [],
                        data: [], // 初始数据为空
                        model: {"icon": "hidden", "label": {"type": "text"}},
                        clickClose: true,
                        radio: true,
                        clearable: true,
                        filterable: true, // 启用过滤功能
                        toolbar: {
                            show: true,
                            list: ['ALL', 'CLEAR', 'REVERSE']
                        },
                        remoteSearch: true,
                        remoteMethod: function (val, cb, show) {
                            // 如果搜索关键词为空，不执行搜索
                            if (!val) {
                                return cb(initformattedData);
                            }
                            let username = ['like', val];
                            // 显示加载状态
                            // 执行远程搜索
                            layui.$.ajax({
                                url: '/app/admin/user/select',
                                data: {username},
                                dataType: "json",
                                success: function (res) {
                                    if (res.code === 0) {
                                        let formattedData = res.data.map(item => {
                                            return {
                                                value: item.id,
                                                name: (item.mobile_code ? '(' + item.mobile_code + ')' : '') + item.username
                                            };
                                        });
                                        cb(formattedData);
                                    } else {
                                        cb(initformattedData);
                                    }
                                },
                                error: function () {
                                    cb(initformattedData);
                                }
                            });
                        },
                    });
                }
            }
        });
    });

    layui.use(["upload", "layer", "popup", "util"], function () {
        let $ = layui.$;

        // 统一的图片上传处理函数
        function initImageUpload(config) {
            let {
                inputSelector,
                uploadBtnSelector,
                deleteBtnSelector,
                previewContainerSelector,
                fieldName
            } = config;

            let input = $(inputSelector);
            let deleteBtn = $(deleteBtnSelector);
            let previewContainer = $(previewContainerSelector);
            let previewImg = previewContainer.find('img');

            // 初始化显示
            function initDisplay() {
                let imgUrl = input.val();
                if (imgUrl) {
                    previewImg.attr('src', imgUrl);
                    previewContainer.show();
                    deleteBtn.show();
                } else {
                    previewContainer.hide();
                    deleteBtn.hide();
                }
            }

            // 初始调用
            initDisplay();

            // 上传功能
            layui.upload.render({
                elem: uploadBtnSelector,
                url: "/app/admin/upload/insert",
                data: {
                    category: 1
                },
                accept: "file",
                field: "__file__",
                done: function (res) {
                    if (res.code) return layui.popup.failure(getText(res.msg));
                    input.val(res.data.url);
                    initDisplay(); // 更新显示
                    parent.refreshTable();
                },
                error: function () {
                    layui.popup.failure(getText('上传失败'));
                }
            });

            // 删除功能
            deleteBtn.on('click', function () {
                layui.layer.confirm(getText('确定要删除这张图片吗？'), function (index) {
                    input.val('');
                    initDisplay(); // 更新显示
                    layui.layer.close(index);
                });
            });

            return {
                initDisplay: initDisplay
            };
        }

        // 初始化三个图片上传组件
        // 证件照正面
        initImageUpload({
            inputSelector: 'input[name="front"]',
            uploadBtnSelector: "#front",
            deleteBtnSelector: "#deleteFront",
            previewContainerSelector: "#frontPreview",
            fieldName: "front"
        });

        // 证件照背面
        initImageUpload({
            inputSelector: 'input[name="back"]',
            uploadBtnSelector: "#back",
            deleteBtnSelector: "#deleteBack",
            previewContainerSelector: "#backPreview",
            fieldName: "back"
        });

        // 手持证件照
        initImageUpload({
            inputSelector: 'input[name="handheld"]',
            uploadBtnSelector: "#handheld",
            deleteBtnSelector: "#deleteHandheld",
            previewContainerSelector: "#handheldPreview",
            fieldName: "handheld"
        });
    });

    // 字段 禁用 status
    layui.use(["form"], function () {
        layui.$("#status").attr("checked", layui.$('input[name="status"]').val() != 0);
        layui.form.render();
        layui.form.on("switch(status)", function (data) {
            layui.$('input[name="status"]').val(this.checked ? 1 : 0);
        });
    });

    // 提交事件
    layui.use(["form", "popup"], function () {
        layui.form.on("submit(save)", function (data) {
            layui.$.ajax({
                url: INSERT_API,
                type: "POST",
                dataType: "json",
                data: data.field,
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    return layui.popup.success(getText("操作成功"), function () {
                        parent.refreshTable();
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                    });
                },
                error: function () {
                    layui.popup.failure(getText("请求失败"));
                }
            });
            return false;
        });
    });

    // 字段 禁用 status
    layui.use(["form"], function () {
        layui.$("#status").attr("checked", layui.$('input[name="status"]').val() != 0);
        layui.form.render();
        layui.form.on("switch(status)", function (data) {
            layui.$('input[name="status"]').val(this.checked ? 1 : 0);
        });
    })

    //提交事件
    layui.use(["form", "popup"], function () {
        layui.form.on("submit(save)", function (data) {
            layui.$.ajax({
                url: INSERT_API,
                type: "POST",
                dateType: "json",
                data: data.field,
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    return layui.popup.success(getText("操作成功"), function () {
                        parent.refreshTable();
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                    });
                }
            });
            return false;
        });
    });

</script>

</body>
</html>
