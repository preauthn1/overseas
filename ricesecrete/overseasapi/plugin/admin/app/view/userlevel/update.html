<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>更新页面</title>
    <link rel="stylesheet" href="/app/admin/component/pear/css/pear.css?v=<?=get_version() ?>"/>
    <link rel="stylesheet" href="/app/admin/admin/css/reset.css?v=<?=get_version() ?>"/>
</head>
<body>

<form class="layui-form">
    <div class="mainBox">
        <div class="main-container mr-5">

            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="编号">编号</label>
                <div class="layui-input-block">
                    <input type="text" name="number" value="" required lay-verify="required" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="名称">名称</label>
                <div class="layui-input-block">
                    <input type="text" name="name" value="" required lay-verify="required" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="充值金额">充值金额</label>
                <div class="layui-input-block">
                    <input type="text" name="price" value="" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="有效推广人数">有效推广人数</label>
                <div class="layui-input-block">
                    <input type="text" name="pop_num" value="" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label required" data-lang="获得奖励">获得奖励</label>
                <div class="layui-input-block">
                    <input type="text" name="award" value="" class="layui-input">
                    <div data-lang="奖励下级兑换HKXA的%比 （5 表示 下级兑换HKXA的5%）">奖励下级兑换HKXA的%比 （5 表示 下级兑换HKXA的5%）</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label" data-lang="KYC认证条件">KYC认证条件</label>
                <div class="layui-input-block">
                    <input type="checkbox" id="kyc" lay-filter="kyc" lay-skin="switch" lay-text="启用|禁用"
                           data-lang="启用|禁用"/>
                    <input type="text" style="display:none" name="kyc" value="0" lay-text="启用|禁用"/>
                </div>
            </div>

            <!--            <div class="layui-form-item">-->
            <!--                <label class="layui-form-label" data-lang="状态">状态</label>-->
            <!--                <div class="layui-input-block">-->
            <!--                    <input type="checkbox" id="status" lay-filter="status" lay-skin="switch" lay-text="启用|禁用" data-lang="启用|禁用"/>-->
            <!--                    <input type="text" style="display:none" name="status" value="0" lay-text="启用|禁用"/>-->
            <!--                </div>-->
            <!--            </div>-->

        </div>
    </div>

    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="pear-btn pear-btn-primary pear-btn-md" lay-submit="" lay-filter="save">
                <span data-lang="提交">提交</span>
            </button>
            <button type="reset" class="pear-btn pear-btn-md">
                <span data-lang="重置">重置</span>
            </button>
        </div>
    </div>

</form>

<script src="/app/admin/component/layui/layui.js?v=<?=layui_version() ?>"></script>
<script src="/app/admin/component/pear/pear.js?v=<?=get_version() ?>"></script>
<script src="/app/admin/admin/js/permission.js"></script>
<script>

    // 相关接口
    const PRIMARY_KEY = "id";
    const SELECT_API = "/app/admin/userLevel/select" + location.search;
    const UPDATE_API = "/app/admin/userLevel/update";

    // 获取数据库记录
    layui.use(["form", "util", "popup"], function () {
        let $ = layui.$;
        $.ajax({
            url: SELECT_API,
            dataType: "json",
            success: function (res) {

                // 给表单初始化数据
                layui.each(res.data[0], function (key, value) {
                    let obj = $('*[name="' + key + '"]');
                    if (key === "password") {
                        obj.attr("placeholder", getText("不更新密码请留空"));
                        return;
                    }
                    if (typeof obj[0] === "undefined" || !obj[0].nodeName) return;
                    if (obj[0].nodeName.toLowerCase() === "textarea") {
                        obj.val(layui.util.escape(value));
                    } else {
                        obj.attr("value", value);
                    }
                });
                // 字段 禁用 status
                layui.use(["form"], function () {
                    layui.$("#status").attr("checked", layui.$('input[name="status"]').val() != 0);
                    layui.form.render();
                    layui.form.on("switch(status)", function (data) {
                        layui.$('input[name="status"]').val(this.checked ? 1 : 0);
                    });
                    layui.$("#kyc").attr("checked", layui.$('input[name="kyc"]').val() != 0);
                    layui.form.render();
                    layui.form.on("switch(kyc)", function (data) {
                        layui.$('input[name="kyc"]').val(this.checked ? 1 : 0);
                    });
                })

                // ajax产生错误
                if (res.code) {
                    layui.popup.failure(res.msg);
                }

            }
        });
    });

    //提交事件
    layui.use(["form", "popup"], function () {
        layui.form.on("submit(save)", function (data) {
            data.field[PRIMARY_KEY] = layui.url().search[PRIMARY_KEY];
            layui.$.ajax({
                url: UPDATE_API,
                type: "POST",
                dateType: "json",
                data: data.field,
                success: function (res) {
                    if (res.code) {
                        return layui.popup.failure(getText(res.msg));
                    }
                    return layui.popup.success(getText("操作成功"), function () {
                        parent.refreshTable();
                        parent.layer.close(parent.layer.getFrameIndex(window.name));
                    });
                }
            });
            return false;
        });
    });

</script>

</body>

</html>
